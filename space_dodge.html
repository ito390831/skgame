<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>スペースドッジ - 宇宙で避けろ！</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Mochiy+Pop+One&display=swap');
  :root{--gold:#f5c842;--safe:#3ec96b;--danger:#ff4757;--pink:#ff6fa8;--cyan:#9fe3ff;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;height:100dvh;overflow:hidden;background:#000;}
  body{font-family:'Kosugi Maru',sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;}
  body.shake{animation:shake .45s ease;}
  @keyframes shake{0%,100%{transform:translate(0,0);}20%{transform:translate(-10px,5px);}40%{transform:translate(10px,-5px);}60%{transform:translate(-7px,3px);}80%{transform:translate(7px,-3px);}}

  /* ===== ステージ（背景はWAVEごとに変化） ===== */
  #stage{position:fixed;inset:0;overflow:hidden;transition:background 1s;background:radial-gradient(ellipse at 50% 30%,#1a2540 0%,#0a0f22 60%,#000 100%);}
  #stage.s1{background:radial-gradient(ellipse at 50% 30%,#3a1410 0%,#1a0606 60%,#000 100%);}
  #stage.s2{background:radial-gradient(ellipse at 50% 30%,#3a2410 0%,#1a1006 60%,#000 100%);}
  #stage.s3{background:radial-gradient(ellipse at 50% 30%,#2a1a40 0%,#120a22 60%,#000 100%);}
  #stage.s4{background:radial-gradient(ellipse at 50% 30%,#1a0028 0%,#05000c 60%,#000 100%);}
  .planet{position:absolute;right:-40px;top:14%;width:170px;height:170px;border-radius:50%;opacity:.85;transition:opacity 1s,background 1s;z-index:1;pointer-events:none;
    background:radial-gradient(circle at 35% 35%,#f2f2f2,#9aa3b0 55%,#4a5260);box-shadow:inset -20px -20px 40px rgba(0,0,0,.5);}
  #stage.s1 .planet{background:radial-gradient(circle at 35% 35%,#ffb08a,#d4532a 55%,#6a1c0a);}
  #stage.s2 .planet{background:repeating-linear-gradient(170deg,#f3d1a2 0 14px,#c98a4b 14px 26px,#e8b77a 26px 36px);}
  #stage.s3 .planet{background:radial-gradient(circle at 35% 35%,#fff1c4,#d9b66a 55%,#7a5a20);}
  #stage.s3 .planet::after{content:'';position:absolute;left:-45%;top:42%;width:190%;height:22%;border-radius:50%;border:6px solid rgba(240,210,150,.75);transform:rotate(-14deg);}
  #stage.s4 .planet{background:radial-gradient(circle,#000 30%,#5b21b6 45%,#ff7a00 55%,transparent 70%);animation:spin 6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #gameCanvas{position:absolute;inset:0;z-index:5;}

  /* ===== 自機 ===== */
  #player{position:absolute;left:0;top:0;z-index:20;width:60px;height:80px;pointer-events:none;will-change:transform;}
  #player .ship{width:100%;height:100%;transition:transform .25s;}
  #player.mini .ship{transform:scale(.6);}
  #player.blink{animation:pblink .15s infinite alternate;}
  @keyframes pblink{from{opacity:1;}to{opacity:.3;}}
  #player.rainbow .ship{animation:rainbow .6s linear infinite;filter:drop-shadow(0 0 12px #fff);}
  @keyframes rainbow{to{filter:hue-rotate(360deg) drop-shadow(0 0 12px #fff);}}
  #player .shield{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;display:none;
    border:3px solid rgba(120,220,255,.9);background:radial-gradient(circle,rgba(120,220,255,0) 55%,rgba(120,220,255,.35));animation:bubble 1s ease-in-out infinite alternate;}
  #player.barrier .shield{display:block;}
  @keyframes bubble{from{transform:scale(.95);}to{transform:scale(1.05);}}

  /* ===== 操作 ===== */
  #controls{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;display:flex;gap:12px;padding:0 14px;pointer-events:none;}
  .ctrl-btn{pointer-events:auto;flex:1;height:64px;border-radius:18px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:center;font-size:26px;color:rgba(255,255,255,.85);touch-action:none;}
  .ctrl-btn.pressed{background:rgba(159,227,255,.3);border-color:var(--cyan);}
  #dragHint{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:39;font-size:12px;color:rgba(255,255,255,.55);pointer-events:none;white-space:nowrap;transition:opacity .6s;}

  /* ===== HUD ===== */
  #hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:0;right:0;z-index:50;display:flex;align-items:center;gap:6px;padding:0 8px;pointer-events:none;}
  #hud .grow{flex:1;display:flex;gap:6px;justify-content:center;}
  .icon-btn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:#fff;font-size:17px;
    cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .card{background:rgba(0,0,0,.45);border:1px solid rgba(245,200,66,.5);border-radius:12px;padding:3px 9px;text-align:center;min-width:70px;}
  .card .lb{font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.7);}
  .card .val{font-family:'Mochiy Pop One',sans-serif;font-size:19px;color:var(--gold);line-height:1.15;white-space:nowrap;}
  .card.dist .val{color:var(--cyan);}
  #subHud{position:fixed;top:calc(56px + env(safe-area-inset-top));left:0;right:0;z-index:50;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 8px;pointer-events:none;}
  .chip{padding:3px 10px;border-radius:14px;font-size:12px;font-weight:700;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);white-space:nowrap;position:relative;overflow:hidden;}
  .chip.wave{color:var(--cyan);}
  .chip.mission{color:#ffe066;}
  .chip.mission.done{background:rgba(62,201,107,.45);border-color:var(--safe);color:#fff;}
  .chip.pw{padding-bottom:5px;}
  .chip.pw i{position:absolute;left:0;bottom:0;height:3px;background:var(--cyan);}

  /* トースト・バナー */
  #toast{position:fixed;left:50%;top:calc(88px + env(safe-area-inset-top));z-index:60;pointer-events:none;transform:translate(-50%,-10px);opacity:0;
    transition:opacity .25s,transform .25s;padding:8px 16px;border-radius:18px;background:rgba(10,0,30,.88);border:2px solid var(--cyan);text-align:center;
    font-family:'Mochiy Pop One',sans-serif;font-size:min(17px,4.4vw);max-width:94vw;}
  #toast.show{opacity:1;transform:translate(-50%,0);}
  #toast.warn{border-color:var(--danger);background:rgba(80,0,10,.9);}
  #toast.good{border-color:var(--gold);}
  #toast .ln{display:block;white-space:nowrap;}
  #toast .sub{font-family:'Kosugi Maru',sans-serif;font-size:min(12px,3.2vw);color:#ffe066;}
  .banner{position:fixed;left:50%;top:34%;z-index:70;pointer-events:none;text-align:center;font-family:'Mochiy Pop One',sans-serif;font-size:min(32px,7.6vw);line-height:1.3;
    padding:14px 24px;border-radius:24px;background:rgba(10,0,30,.85);border:3px solid var(--gold);box-shadow:0 0 30px rgba(245,200,66,.6);
    transform:translate(-50%,-50%) scale(0);transition:transform .35s cubic-bezier(.175,.885,.32,1.275);}
  .banner.show{transform:translate(-50%,-50%) scale(1);}
  .banner.warn{background:rgba(90,0,10,.9);border-color:var(--danger);box-shadow:0 0 40px rgba(255,71,87,.8);animation:wshake .12s infinite;}
  @keyframes wshake{0%{margin-left:-3px;}50%{margin-left:3px;}100%{margin-left:-3px;}}
  .banner .ln{display:block;white-space:nowrap;}
  .banner .sub{display:block;font-family:'Kosugi Maru',sans-serif;font-size:min(15px,3.9vw);margin-top:4px;color:#ffe066;}
  .banner .big{display:block;font-size:48px;line-height:1.2;}
  .pop{position:fixed;z-index:65;pointer-events:none;font-family:'Mochiy Pop One',sans-serif;font-size:20px;white-space:nowrap;text-shadow:0 2px 6px rgba(0,0,0,.8);animation:popUp .9s ease-out forwards;}
  .pop.star{color:var(--gold);} .pop.near{color:var(--cyan);font-size:18px;} .pop.pw{color:#ff9cf0;}
  @keyframes popUp{0%{transform:translate(-50%,0) scale(.6);opacity:0;}20%{transform:translate(-50%,-10px) scale(1.15);opacity:1;}100%{transform:translate(-50%,-60px);opacity:0;}}

  /* カウントダウン */
  #countdown{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);pointer-events:none;}
  #countdown.show{display:flex;}
  #cdNum{font-family:'Mochiy Pop One',sans-serif;font-size:110px;color:var(--gold);text-shadow:0 0 30px rgba(245,200,66,.8),4px 4px 0 #5a3a00;}
  #cdNum.go{color:var(--safe);text-shadow:0 0 30px rgba(62,201,107,.8),4px 4px 0 #003d1a;}
  .cd-anim{animation:cdAnim .9s ease-out;}
  @keyframes cdAnim{0%{transform:scale(2);opacity:0;}30%{transform:scale(1);opacity:1;}100%{transform:scale(.8);opacity:.2;}}

  /* ===== 共通ボタン ===== */
  .btn{padding:13px 32px;font-family:'Mochiy Pop One',sans-serif;font-size:17px;border:none;border-radius:50px;cursor:pointer;
    background:linear-gradient(135deg,var(--gold),#e89500);color:#1a1035;box-shadow:0 6px 20px rgba(245,200,66,.45);-webkit-appearance:none;}
  .btn:active{transform:scale(.95);}
  .btn.sub{background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.5);box-shadow:none;}
  .toggle{padding:7px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font-family:'Kosugi Maru',sans-serif;font-size:13px;cursor:pointer;-webkit-appearance:none;}
  .toggle.on{background:rgba(62,201,107,.35);border-color:var(--safe);}

  /* ===== 画面（スタート・一時停止・結果） ===== */
  .screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;overflow-y:auto;touch-action:pan-y;}
  .screen.hide{display:none;}
  #startScreen{background:linear-gradient(160deg,#0a1440,#1f1a6a,#0a0628);}
  #pauseScreen,#resultScreen{background:rgba(5,0,20,.88);}
  .game-title{font-family:'Mochiy Pop One',sans-serif;font-size:min(32px,8.4vw);color:var(--gold);text-shadow:0 0 20px rgba(245,200,66,.7),3px 3px 0 #5a3a00;white-space:nowrap;}
  .game-sub{font-size:14px;color:rgba(255,255,255,.85);margin:2px 0 10px;}
  .mode-select{display:flex;gap:4px;margin-bottom:10px;background:rgba(255,255,255,.08);border-radius:30px;padding:4px;border:1px solid rgba(255,255,255,.15);}
  .mode-btn{padding:7px 18px;font-family:'Kosugi Maru',sans-serif;font-size:13px;font-weight:700;border:none;border-radius:25px;cursor:pointer;background:transparent;color:rgba(255,255,255,.6);-webkit-appearance:none;}
  .mode-btn.active{background:linear-gradient(135deg,#f5c842,#e89500);color:#1a1035;}
  .mode-btn small{display:block;font-size:10px;font-weight:400;}
  .rules{list-style:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:9px 14px;font-size:12.5px;line-height:1.7;text-align:left;max-width:340px;width:100%;margin-bottom:8px;}
  .rocket-pick{display:flex;gap:6px;margin-bottom:6px;}
  .rk{width:54px;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);padding:4px 2px;cursor:pointer;-webkit-appearance:none;color:#fff;font-size:10px;}
  .rk svg{width:30px;height:40px;display:block;margin:0 auto;}
  .rk.sel{border-color:var(--gold);background:rgba(245,200,66,.2);}
  .rk.locked{opacity:.45;}
  .rk.locked svg{filter:grayscale(1) brightness(.5);}
  .rk-note{font-size:11px;color:rgba(255,255,255,.75);margin-bottom:8px;min-height:15px;}
  .record{font-size:12px;color:var(--gold);margin-bottom:10px;min-height:16px;}
  .settings{display:flex;gap:10px;margin-top:12px;}
  .start-btn{animation:pulseBtn 1.2s infinite alternate;}
  @keyframes pulseBtn{from{transform:scale(1);}to{transform:scale(1.07);}}
  .pause-title{font-family:'Mochiy Pop One',sans-serif;font-size:40px;margin-bottom:16px;}
  .btn-col{display:flex;flex-direction:column;gap:12px;align-items:center;}
  .result-title{font-family:'Mochiy Pop One',sans-serif;font-size:min(40px,10.5vw);color:var(--danger);text-shadow:0 0 24px rgba(255,71,87,.8),3px 3px 0 #5a0000;white-space:nowrap;}
  .rank{font-family:'Mochiy Pop One',sans-serif;font-size:52px;line-height:1;margin:4px 0;}
  .rank.S{color:#ffd700;text-shadow:0 0 24px #ffd700;} .rank.A{color:#ff6fa8;text-shadow:0 0 18px #ff6fa8;} .rank.B{color:#4ecdc4;text-shadow:0 0 14px #4ecdc4;} .rank.C{color:#bbb;}
  .rank-lb{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.7);}
  .score-big{font-family:'Mochiy Pop One',sans-serif;font-size:44px;color:var(--gold);line-height:1.1;}
  .new-record{font-family:'Mochiy Pop One',sans-serif;color:var(--gold);font-size:17px;animation:pblink .5s infinite alternate;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;width:100%;max-width:340px;}
  .stat{background:rgba(255,255,255,.08);border-radius:12px;padding:5px 4px;}
  .stat .lb{font-size:10px;color:rgba(255,255,255,.75);white-space:nowrap;}
  .stat .v{font-family:'Mochiy Pop One',sans-serif;font-size:17px;white-space:nowrap;}
  .mission-res{font-size:13px;padding:6px 12px;border-radius:12px;margin:2px 0 6px;max-width:340px;width:100%;}
  .mission-res.ok{background:rgba(62,201,107,.25);border:1px solid var(--safe);}
  .mission-res.ng{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);}
  .crash{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;margin:2px 0 6px;}
  .crash img{width:56px;height:56px;object-fit:contain;}
  .unlock{font-family:'Mochiy Pop One',sans-serif;font-size:14px;color:#ff9cf0;margin:2px 0;}
  .best-line{font-size:12px;color:rgba(255,255,255,.8);}
  .btn-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center;}
  .rules,.record,.best-line,.game-sub,.rk-note,.mission-res,.crash span{word-break:keep-all;overflow-wrap:anywhere;line-break:strict;}

  @media (max-height:700px){
    .rules{font-size:11.5px;line-height:1.55;}
    .rank{font-size:40px;} .score-big{font-size:36px;}
    .ctrl-btn{height:56px;}
  }
  @media (max-width:360px){
    .card{min-width:58px;padding:3px 5px;} .card .val{font-size:16px;}
    .icon-btn{width:34px;height:34px;font-size:15px;}
    .rk{width:48px;}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="planet"></div>
  <canvas id="gameCanvas"></canvas>
  <div id="player"><div class="ship" id="ship"></div><div class="shield"></div></div>
</div>
<div id="dragHint"></div>
<div id="controls">
  <div class="ctrl-btn" id="btnLeft">◀</div>
  <div class="ctrl-btn" id="btnRight">▶</div>
</div>
<div id="hud">
  <button class="icon-btn" id="homeBtn" aria-label="タイトルへ">🏠</button>
  <div class="grow">
    <div class="card"><div class="lb">SCORE</div><div class="val" id="scoreVal">0</div></div>
    <div class="card dist"><div class="lb">DISTANCE</div><div class="val" id="distVal">0</div></div>
  </div>
  <button class="icon-btn" id="pauseBtn" aria-label="一時停止">⏸</button>
  <button class="icon-btn" id="soundBtn" aria-label="音の切り替え">🔊</button>
</div>
<div id="subHud">
  <div class="chip wave" id="waveChip"></div>
  <div class="chip mission" id="missionChip"></div>
  <div id="pwChips" style="display:contents"></div>
</div>
<div id="toast"></div>
<div class="banner" id="banner"></div>
<div id="countdown"><div id="cdNum">3</div></div>

<!-- スタート画面 -->
<div class="screen" id="startScreen">
  <div class="game-title" data-t="title"></div>
  <div class="game-sub" data-t="sub"></div>
  <div class="mode-select">
    <button class="mode-btn" data-mode="easy"><span data-t="mEasy"></span><small data-t="mEasyS"></small></button>
    <button class="mode-btn active" data-mode="normal"><span data-t="mNormal"></span><small data-t="mNormalS"></small></button>
  </div>
  <ul class="rules" id="rules"></ul>
  <div class="rocket-pick" id="rocketPick"></div>
  <div class="rk-note" id="rkNote"></div>
  <div class="record" id="recordLine"></div>
  <button class="btn start-btn" id="startBtn" data-t="start"></button>
  <div class="settings">
    <button class="toggle" id="soundToggle"></button>
    <button class="toggle" id="kanaToggle"></button>
  </div>
</div>

<!-- 一時停止 -->
<div class="screen hide" id="pauseScreen">
  <div class="pause-title">⏸ PAUSE</div>
  <div class="btn-col">
    <button class="btn" id="resumeBtn" data-t="resume"></button>
    <button class="btn sub" id="pauseTitleBtn" data-t="toTitle"></button>
  </div>
</div>

<!-- 結果 -->
<div class="screen hide" id="resultScreen">
  <div class="result-title">GAME OVER</div>
  <div class="rank-lb">RANK</div>
  <div class="rank" id="rankVal">B</div>
  <div class="score-big" id="finalScore">0</div>
  <div class="new-record" id="newRecord"></div>
  <div class="stats">
    <div class="stat"><div class="lb" id="lbDist"></div><div class="v" id="stDist"></div></div>
    <div class="stat"><div class="lb" id="lbStar"></div><div class="v" id="stStar"></div></div>
    <div class="stat"><div class="lb" id="lbNear"></div><div class="v" id="stNear"></div></div>
  </div>
  <div class="mission-res" id="missionRes"></div>
  <div class="crash" id="crashBox"><img id="crashImg" src="" alt=""><span id="crashText"></span></div>
  <div class="unlock" id="unlockLine"></div>
  <div class="best-line" id="bestLine"></div>
  <div class="btn-row">
    <button class="btn" id="retryBtn" data-t="retry"></button>
    <button class="btn sub" id="titleBtn" data-t="toTitle"></button>
  </div>
</div>

let audioCtx = null;
function ensureAudio() {
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
  catch (e) { audioCtx = null; }
  return audioCtx;
}
function tone(freq, dur, type = 'sine', vol = 0.22, delay = 0, f2 = null) {
  if (!soundOn) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime + delay, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0 + dur);
}
function noise(dur, vol = 0.35) {
  if (!soundOn) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
  const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = buf; g.gain.value = vol; s.connect(g).connect(ctx.destination); s.start();
}
const sStar = () => { tone(1320, 0.08, 'triangle', 0.18); tone(1760, 0.12, 'sine', 0.15, 0.05); };

const sPower = () => [523, 784, 1047, 1568].forEach((n, i) => tone(n, 0.12, 'square', 0.12, i * 0.05));

const sWave = () => [660, 880, 1100].forEach((n, i) => tone(n, 0.14, 'triangle', 0.2, i * 0.08));
const sWarn = () => [0, .25, .5].forEach(d => tone(880, 0.18, 'square', 0.14, d, 660));
const sMission = () => [523, 659, 784, 1047, 1319].forEach((n, i) => tone(n, 0.16, 'triangle', 0.24, i * 0.09));
const sCount = go => go ? tone(1320, 0.35, 'square', 0.18) : tone(660, 0.15, 'square', 0.15);

const G = {

// ===== 画面の寸法 =====
const SC = () => Math.max(0.8, Math.min(1.15, W / 390));
const playerY = () => H - 96 - 64;                    // 自機の中心Y（操作ボタンの上）
const horizonY = () => H * 0.30;
const yAt = z => horizonY() + (playerY() - horizonY()) * z * z;
const sizeAt = z => (18 + z * 92) * SC();
const playerR = () => (now() < G.until.mini ? 13 : 22) * SC();
const now = () => G.elapsed;
function resize() {
  W = innerWidth; H = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
  canvas.width = W * DPR; canvas.height = H * DPR; canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

function initStreaks() { G.streaks = Array.from({ length: 90 }, () => ({ a: rand(0, Math.PI * 2), r: rand(0, 1), s: rand(.2, 1) })); }

// ===== 生成 =====
function waveMul() { return G.wave <= 4 ? WAVE_MUL[G.wave - 1] : Math.min(MUL_MAX, 1.45 + (G.wave - 4) * 0.1); }
function pickEnemyIdx() {
  const w = [];
  for (let i = 0; i < 10; i++) w.push(G.wave === 1 ? Math.max(.2, 5 - i * .55) : G.wave <= 3 ? 1 : Math.max(.3, .3 + i * .55));
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < 10; i++) { r -= w[i]; if (r <= 0) return i; }
  return 0;
}
function spawnEnemy(opt = {}) {
  const idx = opt.idx ?? pickEnemyIdx();
  const x0 = opt.x ?? rand(.06, .94) * W, x1 = opt.x ?? rand(.06, .94) * W;
  G.enemies.push({ idx, z: opt.z ?? 0, x0, x1, dx: 0, rot: rand(0, 360), vr: opt.x != null ? 0 : rand(-90, 90),
    spd: SPEED_TABLE[idx] * 0.35 * MODES[G.mode].speed, alive: true, minD: 1e9, nearDone: false, shower: !!opt.shower });
}
function spawnStar() { G.stars.push({ z: 0, x0: rand(.08, .92) * W, x1: rand(.12, .88) * W, dx: 0, spd: 0.32, alive: true, tw: rand(0, 6) }); }
function spawnPower() {
  const kinds = Object.keys(POWER).filter(k => !(k === 'barrier' && G.barrier));
  G.powers.push({ z: 0, kind: pick(kinds), x0: rand(.12, .88) * W, x1: rand(.15, .85) * W, dx: 0, spd: 0.3, alive: true });
}
function startShower() {
  const gapW = MODES[G.mode].gap * SC();
  const gapX = rand(gapW / 2 + 10, W - gapW / 2 - 10);
  G.shower = { gapX, gapW, warnUntil: G.elapsed + 2, spawned: false, endAt: G.elapsed + 6 };
  sWarn();
  showBanner(`${L(t('shower'))}<span class="sub">${L(t('showerSub'))}</span>`, 'warn', 1600);
}
function spawnShowerRow() {
  const s = G.shower, step = 58 * SC();
  for (let x = step / 2; x < W; x += step) if (Math.abs(x - s.gapX) > s.gapW / 2) spawnEnemy({ idx: 3, x, shower: true });
  s.spawned = true;
}

// ===== 位置計算 =====
const posX = o => o.x0 + (o.x1 - o.x0) * o.z + o.dx;

  const p = $('player');
  p.style.transform = `translate(${G.px - 30}px,${playerY() - 40}px)`;

// ===== メインループ =====
function loop(ts) {
  if (!G.running) return;
  const dt = Math.min(0.05, G.last ? (ts - G.last) / 1000 : 0);  // 裏に回った後などの大きな飛びを防ぐ
  G.last = ts;
  if (!G.paused) update(dt);
  render();
  G.rafId = requestAnimationFrame(loop);
}
function update(dt) {
  const M = MODES[G.mode];
  G.elapsed += dt;
  // WAVE
  const wv = Math.floor(G.elapsed / WAVE_SEC) + 1;
  if (wv > G.wave) {
    G.wave = wv;
    const st = Math.min(4, wv - 1);
    if (st !== G.stage) { G.stage = st; $('stage').className = st ? 's' + st : ''; }
    sWave();
    showBanner(`${L(t('waveBanner', wv, t('st' + Math.min(4, wv - 1))))}<span class="sub">${L(t('waveSub'))}</span>`, '', 1300);
    if (wv === 3 && !G.nextShower) G.nextShower = G.elapsed + rand(4, 8);
    missionCheck();
  }
  G.mul = waveMul();
  $('dragHint').style.opacity = G.elapsed < 5 ? '1' : '0';   // 操作のヒントは最初の5秒だけ
  // 移動
  const sp = 300 * SC();
  if (G.left) G.px -= sp * dt;
  if (G.right) G.px += sp * dt;
  if (G.targetX != null && !G.left && !G.right) {
    const d = G.targetX - G.px, mv = 1100 * dt;
    G.px += Math.abs(d) <= mv ? d : Math.sign(d) * mv;
  }
  G.px = Math.max(26, Math.min(W - 26, G.px));
  placePlayer();
  // 出現
  const showerActive = G.shower && G.elapsed < G.shower.endAt;
  G.spawnAcc += dt * 1000;
  const iv = M.interval[Math.min(4, G.wave - 1)] * (G.wave > 5 ? Math.max(0.7, 1 - (G.wave - 5) * 0.06) : 1);
  if (G.spawnAcc >= iv) { G.spawnAcc -= iv; if (!showerActive) spawnEnemy(); }
  G.starAcc += dt;
  if (G.starAcc >= M.star) { G.starAcc = 0; spawnStar(); }
  if (G.elapsed >= G.nextPower) { G.nextPower = G.elapsed + rand(11, 16); spawnPower(); }
  if (G.wave >= 3 && G.nextShower && !G.shower && G.elapsed >= G.nextShower) startShower();
  if (G.shower) {
    if (!G.shower.spawned && G.elapsed >= G.shower.warnUntil) spawnShowerRow();
    if (G.elapsed >= G.shower.endAt) { G.shower = null; G.nextShower = G.elapsed + rand(25, 35); }
  }
  // 敵
  const pR = playerR(), py = playerY();
  const inv = G.elapsed < G.until.rainbow, safe = G.elapsed < G.invulUntil;
  for (const e of G.enemies) {
    if (!e.alive) continue;
    e.z += e.spd * G.mul * dt; e.rot += e.vr * dt;

    if (e.z < 0.8) continue;
    const x = posX(e), y = yAt(e.z), er = sizeAt(e.z) * 0.30;
    const d = Math.hypot(x - G.px, y - py);
    e.minD = Math.min(e.minD, d - er - pR);
    if (d < er + pR) {
      if (inv) { e.alive = false; burst(x, y, ['#fff', '#ff9cf0', '#9fe3ff'], 18); sBarrier(); G.bonus += 10; pop(x, y, '+10', 'pw'); continue; }
      if (safe) continue;
      if (G.barrier) {
        G.barrier = false; e.alive = false; G.invulUntil = G.elapsed + 1.0;
        $('player').classList.add('blink'); setTimeout(() => $('player').classList.remove('blink'), 1000);
        burst(x, y, ['#9fe3ff', '#fff'], 24); sBarrier(); toast(L(t('barrierUsed')), 'good'); renderPowerUI();
        continue;
      }
      crash(e, x, y); return;
    }
    // すれすれ回避（自機の高さを通り過ぎた時点で判定）
    if (!e.nearDone && e.z > 1.06) {
      e.nearDone = true;
      if (e.minD < 26 * SC() && !inv) { G.nearCount++; G.bonus += 20; sNear(); pop(x, y - 20, t('near'), 'near'); missionCheck(); }
    }

    if (!s.alive) continue;
    s.z += s.spd * G.mul * dt;
    if (s.z > 1.18) { s.alive = false; continue; }
    if (mag && s.z > 0.3) { const dx = G.px - posX(s); s.dx += Math.sign(dx) * Math.min(Math.abs(dx), 420 * dt); }
    if (s.z > 0.85) {
      const x = posX(s), y = yAt(s.z);
      if (Math.hypot(x - G.px, y - py) < sizeAt(s.z) * 0.22 + pR + 12) {
        s.alive = false; G.starCount++; G.bonus += 30; sStar(); pop(x, y, '+30', 'star'); burst(x, y, ['#ffd700', '#fff3a0'], 10); missionCheck();
      }
    }
  }
  // パワーアップ
  for (const p of G.powers) {
    if (!p.alive) continue;
    p.z += p.spd * G.mul * dt;
    if (p.z > 1.18) { p.alive = false; continue; }
    if (p.z > 0.85) {
      const x = posX(p), y = yAt(p.z);
      if (Math.hypot(x - G.px, y - py) < sizeAt(p.z) * 0.3 + pR + 10) { p.alive = false; getPower(p.kind, x, y); }
    }
  }
  G.enemies = G.enemies.filter(e => e.alive); G.stars = G.stars.filter(s => s.alive); G.powers = G.powers.filter(p => p.alive);
  // パーティクル
  for (const q of G.parts) { q.x += q.vx * dt * 60; q.y += q.vy * dt * 60; q.vy += .25 * dt * 60; q.life -= q.d * dt * 60; }
  G.parts = G.parts.filter(q => q.life > 0);
  if (G.elapsed >= 30) missionCheck();
  renderHud();
}

  if (kind === 'barrier') G.barrier = true;

// ===== 描画 =====
function render() {
  ctx.clearRect(0, 0, W, H);
  // 流れる星（スピード感）
  const cx = W / 2, cy = horizonY(), maxR = Math.hypot(W, H) * .7;
  const spd = G.running && !G.paused && !G.over ? (0.25 + G.mul * 0.35) : 0.05;
  ctx.strokeStyle = 'rgba(255,255,255,.7)';
  for (const s of G.streaks) {
    s.r += 0.004 * spd * (0.4 + s.s) * 3;
    if (s.r > 1) { s.r = rand(0, .15); s.a = rand(0, Math.PI * 2); }
    const r1 = s.r * maxR, r0 = Math.max(0, r1 - (6 + 26 * spd) * s.r * 2);
    ctx.globalAlpha = Math.min(1, s.r * 2) * .8; ctx.lineWidth = s.s * 1.6;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(s.a) * r0, cy + Math.sin(s.a) * r0); ctx.lineTo(cx + Math.cos(s.a) * r1, cy + Math.sin(s.a) * r1); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // 流星雨のすき間（安全地帯）を光らせる
  if (G.shower) {
    const a = 0.18 + 0.12 * Math.sin(G.elapsed * 10);
    const gx = G.shower.gapX, gw = G.shower.gapW;
    const grd = ctx.createLinearGradient(0, horizonY(), 0, playerY() + 40);
    grd.addColorStop(0, 'rgba(62,201,107,0)'); grd.addColorStop(1, `rgba(62,201,107,${a + .15})`);
    ctx.fillStyle = grd; ctx.fillRect(gx - gw / 2, horizonY(), gw, playerY() + 40 - horizonY());
    ctx.strokeStyle = `rgba(160,255,190,${a + .3})`; ctx.lineWidth = 2; ctx.strokeRect(gx - gw / 2, playerY() - 50, gw, 100);
  }
  // 奥から順に描く
  const objs = [];
  for (const s of G.stars) objs.push({ z: s.z, f: () => drawStar(s) });
  for (const p of G.powers) objs.push({ z: p.z, f: () => drawPower(p) });
  for (const e of G.enemies) objs.push({ z: e.z, f: () => drawEnemy(e) });
  objs.sort((a, b) => a.z - b.z).forEach(o => o.f());
  for (const q of G.parts) { ctx.globalAlpha = Math.max(0, q.life); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
}
function drawEnemy(e) {
  const img = enemyImgs[e.idx]; if (!img.complete) return;
  const x = posX(e), y = yAt(e.z), s = sizeAt(e.z);
  ctx.save(); ctx.globalAlpha = Math.min(1, .35 + e.z * 1.2); ctx.translate(x, y); ctx.rotate(e.rot * Math.PI / 180);
  const r = img.width / img.height, w = r >= 1 ? s : s * r, h = r >= 1 ? s / r : s;
  ctx.drawImage(img, -w / 2, -h / 2, w, h); ctx.restore();
}
function drawStar(st) {
  const x = posX(st), y = yAt(st.z), s = sizeAt(st.z) * 0.32;
  ctx.save(); ctx.translate(x, y); ctx.rotate(G.elapsed * 2 + st.tw); ctx.globalAlpha = Math.min(1, .4 + st.z);
  ctx.fillStyle = '#ffd700'; ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 12;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? s * .45 : s; const a = i * Math.PI / 5 - Math.PI / 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawPower(p) {
  const x = posX(p), y = yAt(p.z), s = sizeAt(p.z) * 0.42;
  ctx.save(); ctx.globalAlpha = Math.min(1, .4 + p.z);
  const g = ctx.createRadialGradient(x - s * .3, y - s * .3, s * .1, x, y, s);
  g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(.6, 'rgba(160,120,255,.45)'); g.addColorStop(1, 'rgba(255,120,220,.8)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
  ctx.font = `${s * 1.1}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(POWER[p.kind], x, y + s * .05);
  ctx.restore();
}
function burst(x, y, colors, n) { for (let i = 0; i < n; i++) G.parts.push({ x, y, vx: rand(-5, 5), vy: rand(-7, 1), r: rand(2, 5), c: pick(colors), life: 1, d: rand(.02, .04) }); }

// ===== 表示 =====
function pop(x, y, text, cls) {
  const p = document.createElement('div'); p.className = 'pop ' + cls; p.textContent = text;
  p.style.left = x + 'px'; p.style.top = (y - 30) + 'px'; document.body.appendChild(p); setTimeout(() => p.remove(), 920);
}
const toastQ = []; let toastBusy = false;
function toast(html, cls) { toastQ.push({ html, cls }); if (!toastBusy) nextToast(); }
function nextToast() {
  const el = $('toast'), it = toastQ.shift();
  if (!it) { toastBusy = false; return; }
  toastBusy = true; el.className = it.cls || ''; el.innerHTML = it.html; void el.offsetWidth; el.classList.add('show');
  setTimeout(() => { el.classList.remove('show'); setTimeout(nextToast, 250); }, 1700);
}
function showBanner(html, cls, ms) {
  const b = $('banner'); b.className = 'banner ' + (cls || ''); b.innerHTML = html; void b.offsetWidth; b.classList.add('show');
  clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('show'), ms);
}
const score = () => Math.floor(G.elapsed * 10) + G.bonus;
function renderHud() {
  $('scoreVal').textContent = score();
  $('distVal').textContent = fmtKm(G.elapsed);
  $('waveChip').textContent = `${STAGE_ICON[Math.min(4, G.wave - 1)]} ` + t('wave', G.wave, t('st' + Math.min(4, G.wave - 1)));
  renderMission();
  renderPowerUI();
}
function renderPowerUI() {
  const p = $('player');
  p.classList.toggle('barrier', G.barrier);
  p.classList.toggle('mini', G.elapsed < G.until.mini);
  p.classList.toggle('rainbow', G.elapsed < G.until.rainbow);
  const box = $('pwChips'); box.innerHTML = '';
  if (G.barrier) { const c = document.createElement('div'); c.className = 'chip pw'; c.textContent = '🛡'; box.appendChild(c); }
  for (const k of ['mini', 'magnet', 'rainbow']) {
    const left = G.until[k] - G.elapsed;
    if (left > 0) {
      const c = document.createElement('div'); c.className = 'chip pw'; c.textContent = `${POWER[k]} ${Math.ceil(left)}`;
      const bar = document.createElement('i'); bar.style.width = (left / POWER_SEC[k] * 100) + '%'; c.appendChild(bar); box.appendChild(c);
    }
  }
}
function missionProg() {
  const m = G.mission; if (!m) return 0;
  return { survive30: Math.floor(G.elapsed), stars10: G.starCount, near5: G.nearCount, wave3: G.wave, power2: G.powerCount }[m.key];
}
function renderMission() {
  const m = G.mission, c = $('missionChip'); if (!m) { c.textContent = ''; return; }
  c.textContent = `🎯 ${t('m_' + m.key)} ` + (m.done ? '✔' : `${Math.min(m.goal, missionProg())}/${m.goal}`);
  c.classList.toggle('done', m.done);
}
function missionCheck() {
  const m = G.mission;
  if (!m || m.done || missionProg() < m.goal) return;
  m.done = true; G.bonus += MISSION_BONUS; sMission();
  showBanner(`<span class="big">🎯</span>${L(t('missionDone'))}`, '', 1700);
  burst(W / 2, H * .35, ['#ffd700', '#ff6fa8', '#4ecdc4', '#3ec96b', '#fff'], 60);
}
function renderToggles() {
  $('soundToggle').textContent = soundOn ? t('soundOn') : t('soundOff'); $('soundToggle').classList.toggle('on', soundOn);
  $('kanaToggle').textContent = kana ? t('kanaOn') : t('kanaOff'); $('kanaToggle').classList.toggle('on', kana);
  $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
}
function renderRockets() {
  const box = $('rocketPick'); box.innerHTML = '';
  for (const R of ROCKETS) {
    const b = document.createElement('button'); b.type = 'button';
    const ok = unlocked(R);
    b.className = 'rk' + (R.key === rocketKey ? ' sel' : '') + (ok ? '' : ' locked');
    b.innerHTML = rocketSVG(R.key) + (ok ? '' : `<span>🔒⭐${R.need}</span>`);
    b.addEventListener('click', () => {
      if (!ok) { $('rkNote').textContent = t('rkLocked', R.need); return; }
      rocketKey = R.key; store.rocket = R.key; saveStore(); $('ship').innerHTML = rocketSVG(rocketKey); renderRockets(); $('rkNote').textContent = t('rkOk');
    });
    box.appendChild(b);
  }
}
function renderStart() {
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
  const ul = $('rules'); ul.innerHTML = '';
  ['r1', 'r2', 'r3', 'r4', 'r5'].concat(G.mode === 'easy' ? ['r6e'] : []).forEach(k => { const li = document.createElement('li'); li.textContent = t(k); ul.appendChild(li); });
  const r = getRec(G.mode);
  $('recordLine').textContent = t('rec', r.best, r.plays, totalStars());
  $('dragHint').textContent = t('dragHint');
  renderRockets(); renderToggles();
}

// ===== 開始・終了 =====
function resetObjects() { G.enemies = []; G.stars = []; G.powers = []; G.parts = []; }
function startGame() {
  ensureAudio();
  G.gid++; const id = G.gid;
  ['startScreen', 'resultScreen', 'pauseScreen'].forEach(s => $(s).classList.add('hide'));
  resetObjects();
  Object.assign(G, { running:false, paused:false, over:false, elapsed:0, bonus:0, wave:1, stage:0, mul:1, px:W / 2, targetX:null, left:false, right:false,
    spawnAcc:0, starAcc:0, nextPower:rand(8, 11), nextShower:0, shower:null, barrier:MODES[G.mode].barrier,
    until:{ mini:0, magnet:0, rainbow:0 }, invulUntil:1.5, starCount:0, nearCount:0, powerCount:0, crashSrc:null });
  G.mission = Object.assign({ done:false }, pick(MISSIONS));
  $('stage').className = '';
  $('dragHint').style.opacity = '1';
  $('ship').innerHTML = rocketSVG(rocketKey);
  const p = $('player'); p.style.visibility = ''; p.classList.add('blink');
  const r = getRec(G.mode); r.plays++; store[G.mode] = r; saveStore();
  placePlayer(); renderHud();
  const cd = $('countdown'), numEl = $('cdNum');
  cd.classList.add('show');
  let n = 3;
  const tick = () => {
    if (id !== G.gid) return;
    numEl.classList.remove('cd-anim', 'go'); void numEl.offsetWidth;
    if (n > 0) { numEl.textContent = n; sCount(false); numEl.classList.add('cd-anim'); n--; setTimeout(tick, 800); }
    else {
      numEl.textContent = 'GO!'; numEl.classList.add('go', 'cd-anim'); sCount(true);
      setTimeout(() => {
        if (id !== G.gid) return;
        cd.classList.remove('show');
        toast(`${L(t('missionStart'))}${L(t('m_' + G.mission.key), 'sub')}`, 'good');
        G.running = true; G.last = 0; G.rafId = requestAnimationFrame(loop);
        setTimeout(() => { if (id === G.gid) p.classList.remove('blink'); }, 1500);
      }, 550);
    }
  };
  tick();
}
function endGame() {
  G.over = true;
  const id = G.gid;
  // 爆発を少し見せてから結果へ（ループは描画だけ続ける）
  G.paused = true;
  setTimeout(() => { if (id !== G.gid) return; G.running = false; cancelAnimationFrame(G.rafId); showResult(); }, 1100);
  const fade = () => { if (id !== G.gid || !G.running) return; for (const q of G.parts) { q.x += q.vx; q.y += q.vy; q.vy += .25; q.life -= q.d; } G.parts = G.parts.filter(q => q.life > 0); setTimeout(fade, 16); };
  fade();
}
function showResult() {
  const M = MODES[G.mode], sc = score();
  const r = getRec(G.mode), isNew = sc > r.best;
  if (isNew) r.best = sc;
  store[G.mode] = r;
  const before = totalStars();
  store.totalStars = before + G.starCount;
  saveStore();
  const newly = ROCKETS.filter(R => before < R.need && totalStars() >= R.need);
  const rank = sc >= M.rank.S ? 'S' : sc >= M.rank.A ? 'A' : sc >= M.rank.B ? 'B' : 'C';
  $('rankVal').textContent = rank; $('rankVal').className = 'rank ' + rank;
  $('finalScore').textContent = sc;
  $('newRecord').textContent = isNew ? t('newRec') : '';
  $('lbDist').textContent = t('lbDist'); $('lbStar').textContent = t('lbStar'); $('lbNear').textContent = t('lbNear');
  $('stDist').textContent = fmtKm(G.elapsed);
  $('stStar').textContent = G.starCount;
  $('stNear').textContent = G.nearCount;
  const mr = $('missionRes'), m = G.mission;
  mr.className = 'mission-res ' + (m.done ? 'ok' : 'ng');
  mr.textContent = m.done ? t('mOk', t('m_' + m.key)) : t('mNg', t('m_' + m.key), `${Math.min(m.goal, missionProg())}/${m.goal}`);
  $('crashImg').src = G.crashSrc || '';
  $('crashBox').style.display = G.crashSrc ? '' : 'none';
  $('crashText').textContent = t('crash');
  $('unlockLine').textContent = newly.length ? t('unlock') : '';
  $('bestLine').textContent = t('best', r.best);
  document.querySelectorAll('#resultScreen [data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
  $('resultScreen').classList.remove('hide');
}
function goTitle() {
  G.gid++; G.running = false; G.over = false; cancelAnimationFrame(G.rafId);
  resetObjects(); G.shower = null; render();
  ['resultScreen', 'pauseScreen'].forEach(s => $(s).classList.add('hide'));
  $('countdown').classList.remove('show'); $('banner').classList.remove('show');
  $('stage').className = ''; $('player').style.visibility = '';
  renderStart(); $('startScreen').classList.remove('hide');
}
function pauseGame() {
  if (!G.running || G.over || G.paused) return;
  G.paused = true; G.left = G.right = false; G.targetX = null;
  $('pauseScreen').classList.remove('hide');
}
function resumeGame() {
  $('pauseScreen').classList.add('hide');
  if (!G.running || G.over) return;
  // 再開直後にぶつからないよう、ひと呼吸の無敵
  G.invulUntil = Math.max(G.invulUntil, G.elapsed + 1.0);
  $('player').classList.add('blink'); setTimeout(() => $('player').classList.remove('blink'), 1000);
  G.paused = false; G.last = 0;
}

// ===== 操作 =====
function bindHold(el, key) {
  const on = e => { e.preventDefault(); G[key] = true; G.targetX = null; el.classList.add('pressed'); };
  const off = () => { G[key] = false; el.classList.remove('pressed'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
bindHold($('btnLeft'), 'left'); bindHold($('btnRight'), 'right');
// 画面をなぞると自機が指のX位置へ向かう
let dragId = null;
$('stage').addEventListener('pointerdown', e => { if (!G.running || G.paused) return; dragId = e.pointerId; G.targetX = e.clientX; });
window.addEventListener('pointermove', e => { if (e.pointerId === dragId && G.running) G.targetX = e.clientX; });
const endDrag = e => { if (e.pointerId === dragId) { dragId = null; G.targetX = null; } };
window.addEventListener('pointerup', endDrag); window.addEventListener('pointercancel', endDrag);
// キーボード（PC用）
window.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') G.left = true; if (e.key === 'ArrowRight') G.right = true; });
window.addEventListener('keyup', e => { if (e.key === 'ArrowLeft') G.left = false; if (e.key === 'ArrowRight') G.right = false; });

$('startBtn').addEventListener('click', startGame);
$('retryBtn').addEventListener('click', startGame);
$('titleBtn').addEventListener('click', goTitle);
$('pauseBtn').addEventListener('click', pauseGame);
$('resumeBtn').addEventListener('click', resumeGame);
$('pauseTitleBtn').addEventListener('click', goTitle);
$('homeBtn').addEventListener('click', () => {
  if (!$('startScreen').classList.contains('hide')) return;
  if (!G.running || G.over) { goTitle(); return; }
  pauseGame();
});
function toggleSound() { soundOn = !soundOn; store.sound = soundOn; saveStore(); renderToggles(); if (soundOn) { ensureAudio(); sTick(); } }
$('soundToggle').addEventListener('click', toggleSound);
$('soundBtn').addEventListener('click', toggleSound);
$('kanaToggle').addEventListener('click', () => { kana = !kana; store.kana = kana; saveStore(); renderStart(); });
document.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); G.mode = b.dataset.mode; renderStart();
}));
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('resize', resize);

// 初期化
$('ship').innerHTML = rocketSVG(rocketKey);
resize();
renderStart();
render();
(function idle() { if (!G.running) render(); requestAnimationFrame(idle); })();
</script>
</body>
