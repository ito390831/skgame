<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>スペースドッジ - 宇宙で避けろ！</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Mochiy+Pop+One&display=swap');

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#000;}
  body{
    font-family:'Kosugi Maru',sans-serif;
    color:#fff;user-select:none;
    position:relative;
    touch-action:none;
  }

  /* ===== ゲームステージ ===== */
  #stage{
    position:fixed;inset:0;
    background:radial-gradient(ellipse at 50% 40%, #1a0838 0%, #0a0220 60%, #000 100%);
    overflow:hidden;
  }

  /* 星空キャンバス */
  #starsCanvas{position:absolute;inset:0;z-index:1;}

  /* 星雲（彩り） */
  .nebula{
    position:absolute;border-radius:50%;
    filter:blur(40px);opacity:0.3;
    pointer-events:none;z-index:2;
  }
  .nebula.n1{width:300px;height:300px;background:#a855f7;top:10%;left:-50px;}
  .nebula.n2{width:280px;height:280px;background:#3b82f6;top:50%;right:-60px;}
  .nebula.n3{width:200px;height:200px;background:#ec4899;bottom:10%;left:30%;}

  /* 敵キャラ */
  .enemy{
    position:absolute;
    pointer-events:none;
    transform-origin:center center;
    z-index:5;
    will-change:transform,left,top,width,height,opacity;
  }
  .enemy img{
    width:100%;height:100%;
    object-fit:contain;
    filter:drop-shadow(0 0 8px rgba(255,255,255,0.3));
  }

  /* 自機ロケット */
  #player{
    position:absolute;
    width:60px;height:80px;
    bottom:100px;
    transform:translateX(-50%);
    z-index:10;
    pointer-events:none;
    will-change:left;
    transition:filter .2s;
  }
  #player.invincible svg{
    filter:drop-shadow(0 0 10px #ffd700) drop-shadow(0 0 20px #ffaa00);
    animation:goldenPulse .4s ease-in-out infinite alternate;
  }
  #player.blink svg{
    animation:blink .15s infinite alternate;
  }
  @keyframes goldenPulse{
    from{filter:drop-shadow(0 0 8px #ffd700) drop-shadow(0 0 16px #ffaa00);}
    to{filter:drop-shadow(0 0 18px #ffd700) drop-shadow(0 0 36px #ff8800) brightness(1.3);}
  }
  @keyframes blink{from{opacity:1}to{opacity:0.3}}

  /* ボーナスSマーク */
  .bonus-item{
    position:absolute;
    pointer-events:none;
    z-index:6;
    will-change:transform,left,top,width,height,opacity;
  }

  /* HUD */
  #hud{
    position:fixed;top:0;left:0;right:0;
    padding:14px 16px;
    display:flex;justify-content:space-between;align-items:center;
    z-index:50;pointer-events:none;
  }
  .score-card{
    background:rgba(10,5,30,0.7);
    border:1.5px solid rgba(255,215,0,0.4);
    border-radius:12px;
    padding:8px 16px;
    backdrop-filter:blur(8px);
  }
  .score-label{
    font-size:10px;color:#a78bfa;
    letter-spacing:1px;
  }
  .score-value{
    font-family:'Mochiy Pop One',sans-serif;
    font-size:22px;color:#f5c842;
    text-shadow:0 0 12px rgba(245,200,66,0.6);
    line-height:1.1;
  }
  .score-card.right .score-value{color:#fff;font-size:18px;}
  .score-card.right .score-label{color:#94a3b8;}

  /* スタート画面 */
  #startScreen{
    position:fixed;inset:0;
    background:radial-gradient(ellipse at 50% 40%, #1e0a47, #000);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    z-index:200;padding:30px;
    transition:opacity .5s,transform .5s;
  }
  #startScreen.hide{opacity:0;pointer-events:none;transform:scale(1.1);}
  .game-title{
    font-family:'Mochiy Pop One',sans-serif;
    font-size:36px;color:#f5c842;
    text-shadow:0 0 20px rgba(245,200,66,0.7),3px 3px 0 #5a3a00;
    text-align:center;line-height:1.3;letter-spacing:2px;
    margin-bottom:6px;
  }
  .game-sub{
    font-size:14px;color:#a78bfa;
    margin-bottom:24px;text-align:center;
  }
  .rules-card{
    background:rgba(20,10,50,0.7);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:14px;padding:16px 20px;
    font-size:13px;line-height:2;
    margin-bottom:20px;max-width:300px;
    text-align:left;
  }
  .rules-card b{color:#f5c842;}
  .high-score-box{
    margin-bottom:24px;
    background:linear-gradient(135deg,#f5c842,#e89500);
    padding:10px 28px;border-radius:30px;
    color:#1a1035;font-weight:700;
    box-shadow:0 6px 18px rgba(245,200,66,0.35);
  }
  .high-score-box .hs-label{font-size:10px;letter-spacing:2px;}
  .high-score-box .hs-value{
    font-family:'Mochiy Pop One',sans-serif;font-size:22px;
  }
  .start-btn{
    padding:16px 50px;
    font-family:'Mochiy Pop One',sans-serif;font-size:20px;
    border:none;border-radius:50px;cursor:pointer;
    background:linear-gradient(135deg,#3ec96b,#22c55e);
    color:#fff;
    box-shadow:0 8px 24px rgba(62,201,107,0.5);
    animation:pulseBtn 1.2s infinite alternate;
    -webkit-appearance:none;
  }
  @keyframes pulseBtn{from{transform:scale(1)}to{transform:scale(1.06)}}
  .start-btn:active{transform:scale(0.95) !important;}

  /* ゲームオーバー画面 */
  #gameOver{
    position:fixed;inset:0;
    background:rgba(40,0,10,0.88);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    z-index:150;padding:30px;
    opacity:0;pointer-events:none;
    transition:opacity .4s;
  }
  #gameOver.show{opacity:1;pointer-events:all;}
  .go-title{
    font-family:'Mochiy Pop One',sans-serif;
    font-size:46px;color:#ff4757;
    text-shadow:0 0 24px #ff4757,3px 3px 0 #5a0000;
    letter-spacing:3px;margin-bottom:16px;
    transform:scale(0);
    transition:transform .5s cubic-bezier(.175,.885,.32,1.275);
  }
  #gameOver.show .go-title{transform:scale(1);}
  .score-result{
    background:rgba(0,0,0,0.5);
    border:2px solid rgba(255,71,87,0.5);
    border-radius:14px;
    padding:18px 36px;
    text-align:center;margin-bottom:8px;
    transform:scale(0);
    transition:transform .4s .15s cubic-bezier(.175,.885,.32,1.275);
  }
  #gameOver.show .score-result{transform:scale(1);}
  .score-result .label{font-size:11px;color:#94a3b8;letter-spacing:2px;}
  .score-result .num{
    font-family:'Mochiy Pop One',sans-serif;
    font-size:42px;color:#f5c842;
    text-shadow:0 0 16px rgba(245,200,66,0.6);
    line-height:1.1;
  }
  .new-record{
    color:#3ec96b;font-weight:700;font-size:16px;
    margin-bottom:12px;
    transform:scale(0);
    transition:transform .4s .3s cubic-bezier(.175,.885,.32,1.275);
    text-shadow:0 0 12px rgba(62,201,107,0.8);
  }
  #gameOver.show .new-record{transform:scale(1);}
  .new-record.hide{display:none;}
  .hs-display{
    color:#94a3b8;font-size:13px;margin-bottom:24px;
  }
  .retry-btn{
    margin-top:8px;padding:14px 40px;
    font-family:'Mochiy Pop One',sans-serif;font-size:18px;
    border:none;border-radius:50px;cursor:pointer;
    background:linear-gradient(135deg,#f5c842,#e89500);
    color:#1a1035;
    box-shadow:0 6px 18px rgba(245,200,66,0.45);
    transform:scale(0);
    transition:transform .4s .45s cubic-bezier(.175,.885,.32,1.275);
    -webkit-appearance:none;
  }
  #gameOver.show .retry-btn{transform:scale(1);}
  .retry-btn:active{transform:scale(0.95) !important;}

  /* カウントダウン */
  #countdown{
    position:fixed;inset:0;
    display:none;align-items:center;justify-content:center;
    z-index:100;pointer-events:none;
    font-family:'Mochiy Pop One',sans-serif;
    font-size:120px;color:#f5c842;
    text-shadow:0 0 30px rgba(245,200,66,0.8),4px 4px 0 #5a3a00;
  }
  #countdown.show{display:flex;}
  #countdown .num{
    animation:cdAnim 1s ease-out;
  }
  @keyframes cdAnim{
    0%{transform:scale(0.3);opacity:0;}
    30%{transform:scale(1.2);opacity:1;}
    70%{transform:scale(1);opacity:1;}
    100%{transform:scale(1.4);opacity:0;}
  }

  /* 操作ボタン */
  #controls{
    position:fixed;bottom:0;left:0;right:0;
    height:90px;
    display:flex;gap:12px;padding:10px 20px;
    z-index:30;pointer-events:none;
  }
  .ctrl-btn{
    flex:1;
    background:rgba(255,255,255,0.12);
    border:2px solid rgba(255,255,255,0.25);
    border-radius:20px;
    display:flex;align-items:center;justify-content:center;
    font-size:32px;color:rgba(255,255,255,0.85);
    pointer-events:all;
    cursor:pointer;
    transition:background .1s,transform .1s;
    backdrop-filter:blur(6px);
    user-select:none;-webkit-user-select:none;
  }
  .ctrl-btn:active,.ctrl-btn.pressed{
    background:rgba(255,255,255,0.28);
    border-color:rgba(255,215,0,0.6);
    transform:scale(0.95);
  }

  /* 速度倍率表示 */
  #speedBadge{
    position:fixed;top:80px;left:50%;transform:translateX(-50%);
    background:rgba(255,71,87,0.85);
    border:1.5px solid rgba(255,71,87,0.6);
    border-radius:20px;padding:4px 14px;
    font-family:'Mochiy Pop One',sans-serif;
    font-size:13px;color:#fff;
    z-index:50;pointer-events:none;
    display:none;
    box-shadow:0 0 12px rgba(255,71,87,0.5);
  }
  @keyframes speedFlash{
    0%{opacity:0;transform:translateX(-50%) scale(0.6);}
    15%{opacity:1;transform:translateX(-50%) scale(1.15);}
    40%{transform:translateX(-50%) scale(1);}
    80%{opacity:1;}
    100%{opacity:0;transform:translateX(-50%) scale(1);}
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="starsCanvas"></canvas>
  <div class="nebula n1"></div>
  <div class="nebula n2"></div>
  <div class="nebula n3"></div>

  <div id="player">
    <svg id="rocketSvg" viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg" width="60" height="80">
      <defs>
        <linearGradient id="rocketBody" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#c0d8f0"/>
          <stop offset="50%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#90b8d8"/>
        </linearGradient>
        <linearGradient id="rocketNose" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff6b6b"/>
          <stop offset="100%" stop-color="#cc2200"/>
        </linearGradient>
        <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff176"/>
          <stop offset="40%" stop-color="#ff9800"/>
          <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#4488cc"/>
          <stop offset="100%" stop-color="#1a3a6a"/>
        </linearGradient>
        <radialGradient id="windowGrad" cx="40%" cy="35%">
          <stop offset="0%" stop-color="#aaeeff"/>
          <stop offset="100%" stop-color="#2255aa"/>
        </radialGradient>
        <filter id="glowFilter">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="goldenBody" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#f5c842"/>
          <stop offset="50%" stop-color="#fff176"/>
          <stop offset="100%" stop-color="#e89500"/>
        </linearGradient>
      </defs>
      <!-- 炎（アニメ） -->
      <g id="flameGroup">
        <ellipse cx="30" cy="76" rx="7" ry="10" fill="url(#flameGrad)" opacity="0.9">
          <animate attributeName="ry" values="10;14;9;12;10" dur="0.18s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.9;1;0.7;0.95;0.9" dur="0.18s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="30" cy="74" rx="4" ry="7" fill="#fff176" opacity="0.8">
          <animate attributeName="ry" values="7;10;6;8;7" dur="0.14s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <!-- 左フィン -->
      <path d="M18,55 L6,68 L18,62 Z" fill="url(#wingGrad)" stroke="#1a3a6a" stroke-width="0.8"/>
      <!-- 右フィン -->
      <path d="M42,55 L54,68 L42,62 Z" fill="url(#wingGrad)" stroke="#1a3a6a" stroke-width="0.8"/>
      <!-- 本体 -->
      <rect id="rocketBodyRect" x="18" y="30" width="24" height="34" rx="4" fill="url(#rocketBody)" stroke="#6699bb" stroke-width="1"/>
      <!-- ノーズ -->
      <path id="rocketNoseEl" d="M18,30 Q18,8 30,4 Q42,8 42,30 Z" fill="url(#rocketNose)" stroke="#aa1100" stroke-width="1"/>
      <!-- 窓 -->
      <circle id="rocketWindow" cx="30" cy="38" r="8" fill="url(#windowGrad)" stroke="#88bbdd" stroke-width="1.5"/>
      <circle cx="27" cy="36" r="2.5" fill="white" opacity="0.5"/>
      <!-- ストライプ -->
      <rect x="18" y="50" width="24" height="4" fill="#4488cc" opacity="0.6" rx="1"/>
      <!-- 光沢 -->
      <path d="M22,12 Q24,8 28,10 Q26,18 22,20 Z" fill="white" opacity="0.3"/>
    </svg>
  </div>
</div>

<!-- 操作ボタン -->
<div id="controls">
  <div class="ctrl-btn" id="btnLeft">◀</div>
  <div class="ctrl-btn" id="btnRight">▶</div>
</div>

<!-- 速度倍率バッジ -->
<div id="speedBadge"></div>

<!-- HUD -->
<div id="hud">
  <div class="score-card">
    <div class="score-label">SCORE</div>
    <div class="score-value" id="scoreVal">0</div>
  </div>
  <div class="score-card right">
    <div class="score-label">HIGH</div>
    <div class="score-value" id="hudHigh">0</div>
  </div>
</div>

<!-- カウントダウン -->
<div id="countdown"><div class="num" id="cdNum">3</div></div>

<!-- スタート画面 -->
<div id="startScreen">
  <div class="game-title">🚀<br>スペースドッジ</div>
  <div class="game-sub">宇宙を駆け抜けろ！</div>
  <div class="rules-card">
    🎯 <b>左右ボタン長押し</b>で自機を移動<br>
    💫 飛んでくるキャラを<b>避け続けろ！</b><br>
    ⏱️ <b>1秒 = 10点</b>のスコアアタック<br>
    💥 1回でも当たったらゲームオーバー<br>
    ⚡ 1000点ごとに<b>スピード2倍！</b>（最大×16）
  </div>
  <div class="high-score-box">
    <div class="hs-label">★ HIGH SCORE ★</div>
    <div class="hs-value" id="startHigh">0</div>
  </div>
  <button class="start-btn" id="startBtn">▶ スタート</button>
</div>

<!-- ゲームオーバー -->
<div id="gameOver">
  <div class="go-title">GAME OVER</div>
  <div class="score-result">
    <div class="label">YOUR SCORE</div>
    <div class="num" id="finalScore">0</div>
  </div>
  <div class="new-record hide" id="newRecord">🎉 ハイスコア更新！ 🎉</div>
  <div class="hs-display">HIGH SCORE: <span id="goHigh">0</span></div>
  <button class="retry-btn" id="retryBtn">▶ もう一度</button>
</div>

function spawnBonus() {
  const startX = Math.random() * 80 + 10;
  const endX   = Math.random() * 80 + 10;
  const item = {
    z: 0,
    startX, endX,
    rot: 0,
    rotSpeed: 120,
    el: null,
    alive: true,
  };
  const el = document.createElement('div');
  el.className = 'bonus-item';
  el.innerHTML = createSmarkSVG(28);
  document.getElementById('stage').appendChild(el);
  item.el = el;
  bonusItems.push(item);
}

        <stop offset="100%" stop-color="#aa00ff"/>
      </linearGradient>
      <filter id="sGlow">
        <feGaussianBlur stdDeviation="2.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <circle cx="20" cy="20" r="18" fill="rgba(0,0,0,0.4)" stroke="url(#rainbowS)" stroke-width="2.5"/>
    <text x="20" y="27" text-anchor="middle" font-family="Arial Black,sans-serif"
      font-size="22" font-weight="900" fill="url(#rainbowS)" filter="url(#sGlow)">S</text>
  </svg>`;
}

function updateBonusItems(dt) {
  const dtSec = dt / 1000;
  for (const item of bonusItems) {
    if (!item.alive) continue;
    item.z += 0.9 * dtSec * 0.35 * speedMult;
    item.rot += item.rotSpeed * dtSec;

    if (item.z > 1.15) {
      item.alive = false; item.el.remove(); continue;
    }

    const horizonY = stageH * 0.32;
    const targetY  = stageH - 130;
    const y = horizonY + (targetY - horizonY) * (item.z * item.z);
    const centerX = stageW / 2;
    const x0 = (item.startX / 100) * stageW;
    const x1 = (item.endX   / 100) * stageW;
    const x = centerX + (x0 - centerX) * (1 - item.z * 0.4) + (x1 - x0) * item.z * 0.2;
    const size = 18 + item.z * 80;

    item.el.style.left    = (x - size/2) + 'px';
    item.el.style.top     = (y - size/2) + 'px';
    item.el.style.width   = size + 'px';
    item.el.style.height  = size + 'px';
    item.el.style.opacity = Math.min(1, 0.5 + item.z * 1.2);
    item.el.style.transform = `rotate(${item.rot}deg)`;

    // 取得判定
    if (item.z >= 0.8) {
      const playerCenterX = (playerX / 100) * stageW;
      const playerCenterY = stageH - 100 - 40;
      const dx = x - playerCenterX;
      const dy = y - playerCenterY;
      if (Math.sqrt(dx*dx + dy*dy) < size * 0.5 + 30) {
        item.alive = false; item.el.remove();
        activateBonus();
      }
    }
  }
  bonusItems = bonusItems.filter(i => i.alive);
}

function activateBonus() {
  score += 100;
  invincible = true;
  invincibleEnd = performance.now() + BONUS_DURATION;
  clearTimeout(invincibleTimer);
  // 自機を金色に
  const p = document.getElementById('player');
  p.classList.remove('blink');
  p.classList.add('invincible');
  // ボディとノーズを金色に
  setRocketGolden(true);
  showBonusPopup();
  invincibleTimer = setTimeout(() => {
    invincible = false;
    setRocketGolden(false);
    p.classList.remove('invincible');
  }, BONUS_DURATION);
}

function setRocketGolden(on) {
  const bodyEl = document.getElementById('rocketBodyRect');
  const noseEl = document.getElementById('rocketNoseEl');
  const winEl  = document.getElementById('rocketWindow');
  if (!bodyEl) return;
  if (on) {
    bodyEl.setAttribute('fill', 'url(#goldenBody)');
    bodyEl.setAttribute('stroke', '#b8860b');
    noseEl.setAttribute('fill', '#f5c842');
    noseEl.setAttribute('stroke', '#b8860b');
    winEl.setAttribute('fill', '#fff176');
  } else {
    bodyEl.setAttribute('fill', 'url(#rocketBody)');
    bodyEl.setAttribute('stroke', '#6699bb');
    noseEl.setAttribute('fill', 'url(#rocketNose)');
    noseEl.setAttribute('stroke', '#aa1100');
    winEl.setAttribute('fill', 'url(#windowGrad)');
  }
}

function showBonusPopup() {
  const badge = document.getElementById('speedBadge');
  badge.textContent = '⭐ BONUS +100 / 無敵5秒！';
  badge.style.background = 'linear-gradient(135deg,#ff0080,#ff8800,#ffff00,#00ff88,#0088ff,#aa00ff)';
  badge.style.display = 'block';
  badge.style.animation = 'none';
  badge.offsetHeight;
  badge.style.animation = 'speedFlash 2s ease-out forwards';
  clearTimeout(badge._timer);
  badge._timer = setTimeout(() => { badge.style.display = 'none'; }, 2000);
}
let speedMult = 1;
let lastMultLevel = 0; // 最後に倍率更新したスコア帯

function getSpeedMult(score) {
  const level = Math.floor(score / 1000); // 0,1,2,3,4...
  const mult = Math.pow(2, level);        // 1,2,4,8,16...
  return Math.min(mult, 16);              // 上限×16
}

function updateSpeedMult() {
  const newMult = getSpeedMult(score);
  if (newMult !== speedMult) {
    speedMult = newMult;
    // 速度アップ演出
    showSpeedBadge(speedMult);
  }
}

function showSpeedBadge(mult) {
  const badge = document.getElementById('speedBadge');
  badge.textContent = `⚡ SPEED ×${mult}`;
  badge.style.display = 'block';
  badge.style.animation = 'none';
  badge.offsetHeight;
  badge.style.animation = 'speedFlash 1.8s ease-out forwards';
  clearTimeout(badge._timer);
  badge._timer = setTimeout(() => { badge.style.display = 'none'; }, 1800);
}

// ===== ボタン操作 =====
let btnLeftDown = false;
let btnRightDown = false;
const PLAYER_SPEED = 180; // px/%/s

const btnLeft  = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');

function pressLeft(e)  { btnLeftDown = true;  btnLeft.classList.add('pressed');  e.preventDefault(); }
function pressRight(e) { btnRightDown = true; btnRight.classList.add('pressed'); e.preventDefault(); }
function releaseLeft()  { btnLeftDown = false;  btnLeft.classList.remove('pressed'); }
function releaseRight() { btnRightDown = false; btnRight.classList.remove('pressed'); }

btnLeft.addEventListener('touchstart',  pressLeft,  {passive:false});
btnLeft.addEventListener('touchend',    releaseLeft);
btnLeft.addEventListener('touchcancel', releaseLeft);
btnLeft.addEventListener('mousedown',   pressLeft);
btnLeft.addEventListener('mouseup',     releaseLeft);
btnLeft.addEventListener('mouseleave',  releaseLeft);

btnRight.addEventListener('touchstart',  pressRight, {passive:false});
btnRight.addEventListener('touchend',    releaseRight);
btnRight.addEventListener('touchcancel', releaseRight);
btnRight.addEventListener('mousedown',   pressRight);
btnRight.addEventListener('mouseup',     releaseRight);
btnRight.addEventListener('mouseleave',  releaseRight);

function updatePlayerInput(dt) {
  const dtSec = dt / 1000;
  const movePct = (PLAYER_SPEED / stageW) * 100 * dtSec;
  if (btnLeftDown)  playerX = Math.max(12, playerX - movePct);
  if (btnRightDown) playerX = Math.min(88, playerX + movePct);
  updatePlayerPos();
}

// ============================================
// 初期化
// ============================================
function init() {
  updateStageSize();
  drawStars();
  document.getElementById('startHigh').textContent = highScore;
  document.getElementById('hudHigh').textContent = highScore;
  document.getElementById('goHigh').textContent = highScore;
}

function updateStageSize() {
  stageW = window.innerWidth;
  stageH = window.innerHeight;
}

// ============================================
// 星空描画
// ============================================
function drawStars() {
  const canvas = document.getElementById('starsCanvas');
  canvas.width = stageW;
  canvas.height = stageH;
  const ctx = canvas.getContext('2d');
  for (let i = 0; i < 200; i++) {
    const x = Math.random() * stageW;
    const y = Math.random() * stageH;
    const r = Math.random() * 1.2 + 0.3;
    const a = Math.random() * 0.6 + 0.3;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  for (let i = 0; i < 20; i++) {
    const x = Math.random() * stageW;
    const y = Math.random() * stageH;
    const r = Math.random() * 2 + 1.5;
    const colors = ['#ffe08a','#aaddff','#ffaaa5','#ffffff'];
    ctx.fillStyle = colors[Math.floor(Math.random()*colors.length)];
    ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function updatePlayerPos() {
  document.getElementById('player').style.left = playerX + '%';
}

// ============================================
// 敵スポーン
// ============================================
function spawnEnemy() {
  // 時間経過に応じた重み付け
  // 序盤(0-15s): 遅い系(0-3)中心
  // 中盤(15-40s): 全体的に
  // 後半(40s+): 速い系(6-9)が増える
  const t = elapsed / 1000;
  let weights = [];
  for (let i = 0; i < 10; i++) {
    let w;
    if (t < 15) {
      // 遅いほど重い: i=0で5.0, i=9で0.2
      w = Math.max(0.2, 5 - i * 0.55);
    } else if (t < 40) {
      // 平坦
      w = 1.0;
    } else {
      // 速いほど重い: i=0で0.3, i=9で5.0
      w = Math.max(0.3, 0.3 + i * 0.55);
    }
    weights.push(w);
  }
  const total = weights.reduce((a,b)=>a+b, 0);
  let r = Math.random() * total;
  let idx = 0;
  for (let i = 0; i < 10; i++) {
    r -= weights[i];
    if (r <= 0) { idx = i; break; }
  }

  // 敵生成
  const startX = Math.random() * 100; // 0-100% 全幅
  const endX   = Math.random() * 100;
  // ばらつき: 同じ列か少しドリフト
  const enemy = {
    imgIdx: idx,
    speed: SPEED_TABLE[idx],
    z: 0, // 0=奥, 1=手前
    startX, endX,
    rot: Math.random() * 360,
    rotSpeed: (Math.random() - 0.5) * 180, // deg/s
    el: null,
    alive: true,
  };

  // DOM要素作成
  const el = document.createElement('div');
  el.className = 'enemy';
  const img = document.createElement('img');
  img.src = ENEMY_IMAGES[idx];
  el.appendChild(img);
  document.getElementById('stage').appendChild(el);
  enemy.el = el;
  enemies.push(enemy);

  // ボーナスアイテム出現チェック（20回に1回）
  spawnCountSinceBonus++;
  if (spawnCountSinceBonus >= BONUS_INTERVAL) {
    spawnCountSinceBonus = 0;
    spawnBonus();
  }
}

function updateEnemies(dt) {
  const dtSec = dt / 1000;
  for (const e of enemies) {
    if (!e.alive) continue;
    e.z += e.speed * dtSec * 0.35 * speedMult;
    e.rot += e.rotSpeed * dtSec;

    if (e.z > 1.15) {
      // 画面外
      e.alive = false;
      e.el.remove();
      continue;
    }

    // 位置計算（透視投影）
    // 奥（z=0）= 画面中央高さ40%、サイズ小
    // 手前（z=1）= 画面下、プレイヤー高さ、サイズ大
    const horizonY = stageH * 0.32;
    const targetY  = stageH - 90;
    const y = horizonY + (targetY - horizonY) * (e.z * e.z);

    const centerX = stageW / 2;
    const x0 = (e.startX / 100) * stageW;
    const x1 = (e.endX   / 100) * stageW;
    const x  = x0 + (x1 - x0) * e.z;

    const size = 20 + e.z * 100; // 20px → 120px

    e.el.style.left = (x - size/2) + 'px';
    e.el.style.top  = (y - size/2) + 'px';
    e.el.style.width = size + 'px';
    e.el.style.height = size + 'px';
    e.el.style.opacity = Math.min(1, 0.4 + e.z * 1.2);
    e.el.style.transform = `rotate(${e.rot}deg)`;

    // 衝突判定（z>=0.85かつ画面下部の時のみ）
    if (e.z >= 0.85 && !invincible) {
      const playerCenterX = (playerX / 100) * stageW;
      const playerCenterY = stageH - 60 - playerH/2;
      const dx = x - playerCenterX;
      const dy = y - playerCenterY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const collideR = size * 0.35 + 28; // 当たり判定甘め
      if (dist < collideR) {
        gameOver();
        return;
      }
    }
  }
  // 削除済み除去
  enemies = enemies.filter(e => e.alive);
}

// ============================================
// メインループ
// ============================================
function loop(ts) {
  if (!gameRunning) return;
  if (!lastFrame) lastFrame = ts;
  const dt = ts - lastFrame;
  lastFrame = ts;

  elapsed += dt;
  spawnAccum += dt;

  updatePlayerInput(dt);

  // スポーン間隔：時間経過＋speedMultで短く
  const t = elapsed / 1000;
  let baseInterval;
  if (t < 10)      baseInterval = 900;
  else if (t < 25) baseInterval = 700;
  else if (t < 45) baseInterval = 550;
  else if (t < 70) baseInterval = 420;
  else             baseInterval = 320;
  const spawnInterval = baseInterval / speedMult;

  while (spawnAccum >= spawnInterval) {
    spawnEnemy();
    spawnAccum -= spawnInterval;
  }

  updateEnemies(dt);
  updateBonusItems(dt);

  // スコア更新（1秒=10点）
  score = Math.floor(elapsed / 100);
  updateSpeedMult();
  document.getElementById('scoreVal').textContent = score;

  requestAnimationFrame(loop);
}

// ============================================
// ゲーム制御
// ============================================
function startGame() {
  document.getElementById('startScreen').classList.add('hide');
  // カウントダウン
  startCountdown();
}

function startCountdown() {
  const cd = document.getElementById('countdown');
  const num = document.getElementById('cdNum');
  cd.classList.add('show');
  let n = 3;
  num.textContent = n;
  num.style.animation = 'none';
  num.offsetHeight;
  num.style.animation = '';
  const tick = () => {
    n--;
    if (n > 0) {
      num.textContent = n;
      num.style.animation = 'none';
      num.offsetHeight;
      num.style.animation = 'cdAnim 1s ease-out';
      setTimeout(tick, 1000);
    } else {
      num.textContent = 'GO!';
      num.style.animation = 'none';
      num.offsetHeight;
      num.style.animation = 'cdAnim 0.6s ease-out';
      setTimeout(() => {
        cd.classList.remove('show');
        beginPlay();
      }, 600);
    }
  };
  setTimeout(tick, 1000);
}

function beginPlay() {
  score = 0;
  elapsed = 0;
  spawnAccum = 0;
  lastFrame = 0;
  playerX = 50;
  speedMult = 1;
  invincible = true;
  spawnCountSinceBonus = 0;
  clearTimeout(invincibleTimer);
  setRocketGolden(false);
  bonusItems.forEach(i => i.el && i.el.remove());
  bonusItems = [];
  updatePlayerPos();
  document.getElementById('scoreVal').textContent = '0';
  document.getElementById('speedBadge').style.display = 'none';
  enemies.forEach(e => e.el && e.el.remove());
  enemies = [];

  gameRunning = true;
  setTimeout(() => { invincible = false; }, 1500);
  document.getElementById('player').classList.add('blink');
  setTimeout(() => {
    document.getElementById('player').classList.remove('blink');
  }, 1500);
  requestAnimationFrame(loop);
}

function gameOver() {
  gameRunning = false;
  const finalScore = score;
  const isNew = finalScore > highScore;
  if (isNew) {
    highScore = finalScore;
    localStorage.setItem(HS_KEY, String(highScore));
  }
  document.getElementById('finalScore').textContent = finalScore;
  document.getElementById('goHigh').textContent = highScore;
  document.getElementById('hudHigh').textContent = highScore;
  document.getElementById('newRecord').classList.toggle('hide', !isNew);
  document.getElementById('gameOver').classList.add('show');
}

function retry() {
  document.getElementById('gameOver').classList.remove('show');
  setTimeout(() => {
    startCountdown();
  }, 350);
}

// ============================================
// イベント
// ============================================
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', retry);
window.addEventListener('resize', () => {
  updateStageSize();
  drawStars();
});

// 初期化
init();
playerX = 50;
updatePlayerPos();
</script>
