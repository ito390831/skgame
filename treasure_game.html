<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>どれが当たり？宝箱ゲーム</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Mochiy+Pop+One&display=swap');

  :root {
    --gold:#f5c842;
    --gold-dark:#b8860b;
    --pink:#ff6fa8;
    --safe:#3ec96b;
    --danger:#ff4757;
    --dark:#1a1035;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html, body { height: 100%; overflow: hidden; }

  body{
    font-family:'Kosugi Maru', sans-serif;
    background: linear-gradient(160deg,#1e0a47 0%,#3a1f7a 40%,#5a2d9b 70%,#1a0838 100%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:16px 12px;
    position:relative;
    user-select:none;
  }

  /* 星空 */
  .stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 2.5s infinite alternate;}
  @keyframes twinkle{0%{opacity:.2;transform:scale(1);}100%{opacity:1;transform:scale(1.6);}}

  /* ヘッダー */
  .header{text-align:center;z-index:5;margin-bottom:12px;}
  .title{
    font-family:'Mochiy Pop One',sans-serif;
    font-size:24px;
    color:var(--gold);
    text-shadow: 0 0 16px rgba(245,200,66,.7), 2px 2px 0 #5a3a00;
    letter-spacing:2px;
  }
  .subtitle{font-size:12px;color:rgba(255,255,255,.75);margin-top:2px;}

  /* 進捗 */
  .progress{display:flex;gap:5px;margin-bottom:16px;z-index:5;flex-wrap:wrap;justify-content:center;max-width:340px;}
  .pip{
    width:26px;height:26px;border-radius:50%;
    border:2px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:rgba(255,255,255,.4);
    transition:all .4s;
  }
  .pip.done{background:var(--safe);border-color:var(--safe);color:#fff;box-shadow:0 0 10px var(--safe);}
  .pip.current{border-color:var(--gold);color:var(--gold);box-shadow:0 0 8px var(--gold);animation:pulsePip .8s infinite alternate;}
  @keyframes pulsePip{from{transform:scale(1);}to{transform:scale(1.18);}}

  /* メッセージ */
  .message{
    color:#fff;font-size:15px;text-align:center;margin-bottom:12px;
    background:rgba(0,0,0,.3);padding:6px 16px;border-radius:20px;
    border:1px solid rgba(255,255,255,.15);z-index:5;
  }

  /* アリーナ */
  .arena{
    z-index:5;display:flex;flex-direction:column;align-items:center;
    gap:18px;width:100%;max-width:380px;flex:1;justify-content:center;
  }
  .boxes-row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:nowrap;}

  /* 宝箱ボタン */
  .box-btn{
    width:105px;height:110px;border:none;background:none;cursor:pointer;
    position:relative;border-radius:16px;transition:transform .15s;
    padding:0;-webkit-appearance:none;flex-shrink:0;
  }
  .box-btn:active{transform:scale(.93);}
  .box-btn.shake{animation:shake .45s ease;}
  .box-btn.bounce{animation:bounce .55s ease;}
  .box-btn.fade{opacity:.3;}
  @keyframes shake{
    0%,100%{transform:translateX(0) rotate(0);}
    20%{transform:translateX(-9px) rotate(-4deg);}
    40%{transform:translateX(9px) rotate(4deg);}
    60%{transform:translateX(-7px) rotate(-3deg);}
    80%{transform:translateX(7px) rotate(3deg);}
  }
  @keyframes bounce{
    0%{transform:scale(1);}
    30%{transform:scale(1.18) rotate(-6deg);}
    60%{transform:scale(.93);}
    100%{transform:scale(1);}
  }

  .box-svg{width:100%;height:100%;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5));}
  .box-btn:hover .box-svg{filter:drop-shadow(0 8px 22px rgba(245,200,66,.5));}

  .box-label{
    position:absolute;top:-8px;left:50%;transform:translateX(-50%);
    background:var(--gold);color:#3a2200;font-weight:900;font-size:13px;
    padding:2px 12px;border-radius:12px;box-shadow:0 3px 6px rgba(0,0,0,.3);
    font-family:'Mochiy Pop One',sans-serif;
  }

  .hint{
    font-size:12px;color:rgba(255,255,255,.55);text-align:center;
    animation:blink 1.5s infinite;
  }
  @keyframes blink{0%,100%{opacity:.5;}50%{opacity:1;}}

  /* リザルトオーバーレイ */
  .overlay{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:100;
    opacity:0;pointer-events:none;transition:opacity .4s;padding:20px;
  }
  .overlay.show{opacity:1;pointer-events:all;}
  .overlay.lose-bg{background:rgba(40,5,5,.92);}
  .overlay.win-bg{background:rgba(5,30,15,.88);}
  .overlay.goal-bg{background:rgba(10,0,30,.55);}

  .result-img-wrap{
    width:240px;height:240px;border-radius:24px;overflow:hidden;
    margin-bottom:18px;transform:scale(0);
    transition:transform .5s cubic-bezier(.175,.885,.32,1.275);
    background:rgba(255,255,255,.95);
    box-shadow:0 12px 40px rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;
  }
  .overlay.show .result-img-wrap{transform:scale(1);}
  .result-img{width:100%;height:100%;object-fit:contain;}

  .result-text{
    font-family:'Mochiy Pop One',sans-serif;
    font-size:52px;font-weight:900;letter-spacing:3px;
    transform:scale(0);
    transition:transform .4s .2s cubic-bezier(.175,.885,.32,1.275);
  }
  .overlay.show .result-text{transform:scale(1);}
  .result-text.lose{color:var(--danger);text-shadow:0 0 24px var(--danger),3px 3px 0 #5a0000;font-size:38px;letter-spacing:1px;white-space:nowrap;}
  .result-text.win{color:var(--safe);text-shadow:0 0 24px var(--safe),3px 3px 0 #003d1a;}
  .result-text.goal{
    color:var(--gold);
    text-shadow:0 0 30px var(--gold),3px 3px 0 #5a3a00;
    font-size:64px;
    animation:goalPulse 1s infinite alternate;
  }
  @keyframes goalPulse{from{transform:scale(1);}to{transform:scale(1.08);}}

  .goal-sub{
    font-size:18px;color:rgba(255,255,255,.9);margin-top:10px;
    text-align:center;transform:scale(0);
    transition:transform .4s .3s cubic-bezier(.175,.885,.32,1.275);
    font-weight:700;
  }
  .overlay.show .goal-sub{transform:scale(1);}

  .next-btn{
    margin-top:24px;padding:14px 38px;
    font-family:'Mochiy Pop One',sans-serif;font-size:17px;
    border:none;border-radius:50px;cursor:pointer;
    background:linear-gradient(135deg,var(--gold),#e89500);
    color:#1a1035;
    box-shadow:0 6px 18px rgba(245,200,66,.45);
    transform:scale(0);
    transition:transform .4s .4s cubic-bezier(.175,.885,.32,1.275);
    -webkit-appearance:none;
  }
  .overlay.show .next-btn{transform:scale(1);}
  .next-btn:active{transform:scale(.93) !important;}

  /* 金色おめでとう吹き出し */
  .congrats-balloon{
    font-family:'Mochiy Pop One',sans-serif;
    font-size:34px;font-weight:900;letter-spacing:2px;
    color:#1a1035;
    background:linear-gradient(135deg,#ffe066,#f5c842,#e89500);
    padding:12px 32px;border-radius:50px;
    border:4px solid #fff;
    box-shadow:0 0 30px rgba(245,200,66,.8), 0 6px 20px rgba(0,0,0,.4);
    margin-bottom:14px;
    position:relative;
    animation:congratsBounce .6s ease-in-out infinite alternate;
    white-space:nowrap;
  }
  .congrats-balloon::after{
    content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);
    width:0;height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:14px solid #f5c842;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));
  }
  @keyframes congratsBounce{
    0%{transform:scale(1) rotate(-2deg);}
    100%{transform:scale(1.08) rotate(2deg);}
  }

  /* お祝いキャラクター */
  .celebration{
    display:none;
    gap:12px;align-items:flex-end;justify-content:center;
    margin-bottom:16px;
    opacity:0;
    transform:translateY(120px);
    transition:transform .6s cubic-bezier(.175,.885,.32,1.275), opacity .6s;
  }

  .chara-wrap{
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .chara-img{
    width:100px;height:100px;object-fit:contain;
    transform-origin:bottom center;
    animation:banzai 0.7s ease-in-out infinite alternate;
  }
  .chara-wrap:nth-child(1) .chara-img{animation-delay:0s;}
  .chara-wrap:nth-child(2) .chara-img{animation-delay:0.2s;}

  @keyframes banzai{
    0%{transform:translateY(0) rotate(-4deg) scaleY(1);}
    40%{transform:translateY(-14px) rotate(0deg) scaleY(1.05);}
    100%{transform:translateY(-22px) rotate(4deg) scaleY(1.08);}
  }

  .chara-speech{
    font-size:12px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#ff6fa8,#ff4fa0);
    padding:3px 8px;border-radius:10px;
    box-shadow:0 2px 8px rgba(255,111,168,.5);
    white-space:nowrap;
    animation:speechPop .6s infinite alternate;
  }
  .chara-wrap:nth-child(2) .chara-speech{background:linear-gradient(135deg,#4ecdc4,#2ab5ab);box-shadow:0 2px 8px rgba(78,205,196,.5);}
  @keyframes speechPop{
    0%{transform:scale(1);}
    100%{transform:scale(1.1);}
  }
  /* イージーモード パルス発光 */
  .box-btn.pulse-hint .box-svg{
    animation:pulseHint 1.5s ease-in-out infinite;
  }
  @keyframes pulseHint{
    0%,100%{
      filter:drop-shadow(0 8px 16px rgba(0,0,0,.5)) drop-shadow(0 0 6px rgba(255,215,0,.4));
      transform:scale(1);
    }
    50%{
      filter:drop-shadow(0 8px 16px rgba(0,0,0,.5)) drop-shadow(0 0 20px rgba(255,215,0,.9)) drop-shadow(0 0 30px rgba(255,193,7,.5));
      transform:scale(1.04);
    }
  }

  /* モード選択 */
  .mode-select{
    display:flex;gap:6px;margin-bottom:18px;
    background:rgba(255,255,255,.08);
    border-radius:30px;padding:4px;
    border:1px solid rgba(255,255,255,.15);
  }
  .mode-btn{
    padding:8px 18px;font-family:'Kosugi Maru',sans-serif;
    font-size:13px;font-weight:700;
    border:none;border-radius:25px;cursor:pointer;
    background:transparent;color:rgba(255,255,255,.6);
    transition:all .25s;-webkit-appearance:none;
  }
  .mode-btn.active{
    background:linear-gradient(135deg,#f5c842,#e89500);
    color:#1a1035;box-shadow:0 3px 10px rgba(245,200,66,.4);
  }
  .mode-btn small{display:block;font-size:10px;font-weight:400;margin-top:1px;}

  #fwCanvas, #particleCanvas{
    position:fixed;inset:0;pointer-events:none;
  }
  #fwCanvas{z-index:99;}
  #particleCanvas{z-index:50;}

  /* スタート画面 */
  .start-screen{
    position:fixed;inset:0;background:linear-gradient(160deg,#1e0a47,#3a1f7a,#1a0838);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:200;padding:30px;text-align:center;
    transition:opacity .5s, transform .5s;
  }
  .start-screen.hide{opacity:0;pointer-events:none;transform:scale(1.1);}
  .start-title{
    font-family:'Mochiy Pop One',sans-serif;font-size:32px;color:var(--gold);
    text-shadow:0 0 20px rgba(245,200,66,.7),3px 3px 0 #5a3a00;
    margin-bottom:8px;letter-spacing:2px;line-height:1.3;
  }
  .start-sub{font-size:14px;color:rgba(255,255,255,.85);margin-bottom:24px;line-height:1.6;}
  .start-rules{
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
    border-radius:14px;padding:14px 18px;color:#fff;font-size:13px;
    text-align:left;margin-bottom:28px;line-height:1.8;max-width:300px;
  }
  .start-btn{
    padding:16px 50px;font-family:'Mochiy Pop One',sans-serif;font-size:20px;
    border:none;border-radius:50px;cursor:pointer;
    background:linear-gradient(135deg,var(--gold),#e89500);
    color:#1a1035;box-shadow:0 8px 24px rgba(245,200,66,.5);
    animation:pulseBtn 1.2s infinite alternate;
    -webkit-appearance:none;
  }
  @keyframes pulseBtn{from{transform:scale(1);}to{transform:scale(1.08);}}
  .start-btn:active{transform:scale(.95) !important;}

  @media (max-height: 640px) {
    .title{font-size:20px;}
    .box-btn{width:92px;height:96px;}
    .boxes-row{gap:8px;}
    .progress{margin-bottom:10px;}
    .pip{width:22px;height:22px;font-size:10px;}
    .result-img-wrap{width:190px;height:190px;}
    .result-text{font-size:42px;}
    .result-text.lose{font-size:30px;}
  }

  @media (max-width: 360px) {
    .box-btn{width:92px;height:96px;}
    .boxes-row{gap:8px;}
  }
</style>
</head>

    🎆 10連続成功でゴール！
  </div>
  <div class="mode-select" id="modeSelect">
    <button class="mode-btn active" data-mode="normal">ノーマル<small>大人向け</small></button>
    <button class="mode-btn" data-mode="easy">イージー<small>子ども向け</small></button>

// ===== ゲーム状態 =====
const TOTAL = 10;
const HINT_DELAY = 3000; // イージー: 3秒後にヒント
let score = 0;
let active = false;
let audioCtx = null;
let gameMode = 'normal'; // 'normal' or 'easy'
let hintTimer = null;
let currentLoseBox = -1; // 現在ラウンドのハズレ位置

// ===== 星空 =====
(function(){
  const c = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 1;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*2.5}s;animation-duration:${1.5+Math.random()*2}s;`;
    c.appendChild(s);
  }
})();

// ===== 進捗 =====
function renderProgress() {
  const w = document.getElementById('progressWrap');
  w.innerHTML = '';
  for (let i = 0; i < TOTAL; i++) {
    const p = document.createElement('div');
    p.className = 'pip' + (i < score ? ' done' : i === score ? ' current' : '');
    p.textContent = i < score ? '✓' : (i + 1);
    w.appendChild(p);
  }
  document.getElementById('messageBox').textContent =
    score === 0 ? 'どれか1つをタップ！' :
    score >= TOTAL ? '🎉 全クリ！' :
    `${score}連続セーフ中！あと${TOTAL - score}回`;
}

// ===== オーディオ =====
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq, dur, type = 'sine', vol = 0.3, delay = 0) {
  const ctx = ensureAudio();
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur);
}

function playGlide(f1, f2, dur, type = 'sine', vol = 0.3, delay = 0) {
  const ctx = ensureAudio();
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f1, t0);
  osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur);
}

function soundTap() {
  playTone(800, 0.05, 'square', 0.15);
}
function soundWin() {
  // ピンポン+祝音
  playTone(523, 0.12, 'sine', 0.3, 0);    // C
  playTone(659, 0.12, 'sine', 0.3, 0.08); // E
  playTone(784, 0.12, 'sine', 0.3, 0.16); // G
  playTone(1047, 0.25, 'sine', 0.35, 0.24); // C
  playTone(1047, 0.08, 'triangle', 0.2, 0.5);
  playTone(1319, 0.3, 'sine', 0.3, 0.55);
}
function soundLose() {
  // ブブー+下降
  playGlide(400, 100, 0.5, 'sawtooth', 0.25, 0);
  playGlide(350, 80, 0.5, 'sawtooth', 0.2, 0.1);
}
function soundGoal() {
  // ファンファーレ
  const notes = [523, 659, 784, 1047, 784, 1047, 1319];
  notes.forEach((n, i) => playTone(n, 0.18, 'triangle', 0.3, i * 0.12));
  playTone(1568, 0.5, 'triangle', 0.35, notes.length * 0.12);
  playTone(1047, 0.5, 'sine', 0.3, notes.length * 0.12);
}
function soundFirework() {
  const ctx = ensureAudio();
  // ヒュー
  playGlide(200, 1200, 0.4, 'sine', 0.15, 0);
  // ドーン (ノイズ)
  setTimeout(() => {
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.4, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    src.connect(gain).connect(ctx.destination);
    src.start();
  }, 400);
}

// ===== ラウンド開始（ハズレ位置決定+ヒントタイマー起動） =====
function startRound() {
  // 1/3で全部セーフ、2/3で通常
  const fullSafe = Math.random() < 1/3;
  currentLoseBox = fullSafe ? -1 : Math.floor(Math.random() * 3);

  active = true;

  // イージーモード: 5秒後にセーフ宝箱を1つパルス表示
  if (gameMode === 'easy') {
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => {
      if (!active) return;
      // セーフな箱（loseBox以外）からランダム1つ選択
      const safeBoxes = [];
      for (let i = 0; i < 3; i++) {
        if (i !== currentLoseBox) safeBoxes.push(i);
      }
      const hintIdx = safeBoxes[Math.floor(Math.random() * safeBoxes.length)];
      document.getElementById('box' + hintIdx).classList.add('pulse-hint');
    }, HINT_DELAY);
  }
}

function clearHints() {
  clearTimeout(hintTimer);
  hintTimer = null;
  for (let i = 0; i < 3; i++) {
    document.getElementById('box' + i).classList.remove('pulse-hint');
  }
}

// ===== 選択 =====
function selectBox(idx) {
  if (!active) return;
  active = false;
  clearHints();
  soundTap();
  document.getElementById('hint').style.opacity = '0';

  const isWin = (currentLoseBox === -1) || (idx !== currentLoseBox);

  const btn = document.getElementById('box' + idx);
  // 選ばなかった他の2つをフェード
  for (let i = 0; i < 3; i++) {
    if (i !== idx) document.getElementById('box' + i).classList.add('fade');
  }
  btn.classList.add(isWin ? 'bounce' : 'shake');
  burstParticles(btn, isWin);

  setTimeout(() => showResult(isWin), 650);
}

// ===== パーティクル =====
function burstParticles(btn, isWin) {
  const canvas = document.getElementById('particleCanvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const colors = isWin
    ? ['#ffd700','#3ec96b','#4ecdc4','#fff','#ff6fa8']
    : ['#666','#888','#444','#a0a0a0'];

  const ps = Array.from({length: 28}, () => ({
    x:cx, y:cy,
    vx:(Math.random()-0.5)*14,
    vy:(Math.random()-1.4)*11,
    r:Math.random()*5+3,
    color:colors[Math.floor(Math.random()*colors.length)],
    life:1, decay:0.025+Math.random()*0.025,
    rot:Math.random()*Math.PI*2, vrot:(Math.random()-0.5)*0.3,
    shape:Math.random()<0.5?'circle':'square'
  }));

  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    for (const p of ps) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.45;
      p.life -= p.decay; p.rot += p.vrot;
      if (p.life <= 0) continue;
      alive = true;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0,0,p.r,0,Math.PI*2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2);
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (alive) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}

// ===== リザルト表示 =====
function showResult(isWin) {
  const overlay = document.getElementById('resultOverlay');
  const img = document.getElementById('resultImg');
  const text = document.getElementById('resultText');
  const goalSub = document.getElementById('goalSub');
  const nextBtn = document.getElementById('nextBtn');

  overlay.classList.remove('lose-bg','win-bg','goal-bg');
  text.classList.remove('lose','win','goal');
  goalSub.style.display = 'none';

  if (isWin) {
    score++;
    if (score >= TOTAL) {
      // ゴール
      img.src = IMG_SUIT;
      text.textContent = 'ゴール！';
      text.classList.add('goal');
      goalSub.textContent = '10連続セーフ達成！';
      goalSub.style.display = 'block';
      overlay.classList.add('goal-bg');
      nextBtn.textContent = 'もう一度遊ぶ';
      nextBtn.dataset.mode = 'reset';
      // 上段キャラ画像セット（2キャラ）
      document.getElementById('charaMax').src   = IMG_MAX;
      document.getElementById('charaSmall').src = IMG_WIN;
      // 金色おめでとう吹き出し表示
      document.getElementById('congratsBalloon').style.display = 'block';
      soundGoal();
      launchFireworks();
      // overlay.show後にcelebration表示（CSSトランジション発火のため遅延）
      setTimeout(() => {
        const cel = document.getElementById('celebration');
        cel.style.display = 'flex';
        // display:flex直後はトランジション効かないので1フレーム待つ
        requestAnimationFrame(() => requestAnimationFrame(() => {
          cel.style.opacity = '1';
          cel.style.transform = 'translateY(0)';
        }));
      }, 150);
      // 自動遷移（fwTimersと独立管理）
      autoReturnTimer = setTimeout(() => {
        goToStart();
      }, 8 * 700 + 3000);
    } else {
      img.src = IMG_WIN;
      text.textContent = 'セーフ！';
      text.classList.add('win');
      overlay.classList.add('win-bg');
      nextBtn.textContent = '次へ ▶';
      nextBtn.dataset.mode = 'next';
      soundWin();
    }
  } else {
    // ハズレ画像をランダムに選択
    img.src = IMG_LOSE[Math.floor(Math.random() * IMG_LOSE.length)];
    text.textContent = 'ゲームオーバー';
    text.classList.add('lose');
    overlay.classList.add('lose-bg');
    nextBtn.textContent = 'もう一度遊ぶ';
    nextBtn.dataset.mode = 'reset';
    soundLose();
  }

  renderProgress();
  setTimeout(() => overlay.classList.add('show'), 50);
}

// ===== 次へ / リセット =====
function nextRound() {
  const nextBtn = document.getElementById('nextBtn');
  const isReset = nextBtn.dataset.mode === 'reset';
  if (isReset) {
    goToStart();
  } else {
    const overlay = document.getElementById('resultOverlay');
    overlay.classList.remove('show');
    setTimeout(() => {
      renderProgress();
      for (let i = 0; i < 3; i++) {
        document.getElementById('box' + i).classList.remove('shake','bounce','fade','pulse-hint');
      }
      document.getElementById('hint').style.opacity = '1';
      startRound();
    }, 400);
  }
}

// ===== 花火 =====
let fwAnim = null;
let fwParticles = [];
let fwTimers = [];
let autoReturnTimer = null;

function goToStart() {
  clearTimeout(autoReturnTimer);
  autoReturnTimer = null;
  clearHints();
  const overlay = document.getElementById('resultOverlay');
  const cel = document.getElementById('celebration');
  overlay.classList.remove('show');
  cel.style.display = 'none';
  cel.style.opacity = '0';
  cel.style.transform = 'translateY(120px)';
  document.getElementById('congratsBalloon').style.display = 'none';
  stopFireworks();
  setTimeout(() => {
    score = 0;
    renderProgress();
    for (let i = 0; i < 3; i++) {
      document.getElementById('box' + i).classList.remove('shake','bounce','fade','pulse-hint');
    }
    document.getElementById('hint').style.opacity = '1';
    document.getElementById('startScreen').classList.remove('hide');
    active = false; // スタート画面ではfalse、startGameでtrueに
  }, 450);
}

function launchFireworks() {
  const canvas = document.getElementById('fwCanvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  fwParticles = [];

  function spawn() {
    const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
    const y = Math.random() * canvas.height * 0.4 + canvas.height * 0.1;
    const hue = Math.random() * 360;
    const count = 50 + Math.floor(Math.random() * 30);
    soundFirework();
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count;
      const speed = Math.random() * 5 + 3;
      fwParticles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.012 + Math.random() * 0.012,
        color: `hsl(${hue + Math.random()*40}, 90%, 60%)`,
        r: Math.random() * 2.5 + 1.5
      });
    }
  }

  // 連続で打ち上げ
  for (let i = 0; i < 8; i++) {
    fwTimers.push(setTimeout(spawn, i * 700));
  }

  function animate() {
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    for (const p of fwParticles) {
      if (p.life <= 0) continue;
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.06;
      p.vx *= 0.98; p.vy *= 0.98;
      p.life -= p.decay;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    fwParticles = fwParticles.filter(p => p.life > 0);
    fwAnim = requestAnimationFrame(animate);
  }
  animate();
}

function stopFireworks() {
  if (fwAnim) {
    cancelAnimationFrame(fwAnim);
    fwAnim = null;
  }
  fwTimers.forEach(t => clearTimeout(t));
  fwTimers = [];
  fwParticles = [];
  const canvas = document.getElementById('fwCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

// ===== スタート =====
function startGame() {
  ensureAudio();
  soundTap();
  document.getElementById('startScreen').classList.add('hide');
  // 少し待ってからラウンド開始（スタート画面が消えてから5秒タイマー起動）
  setTimeout(() => startRound(), 500);
}

// 初期化
renderProgress();

// ===== イベントリスナー登録 =====
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('box0').addEventListener('click', () => selectBox(0));
document.getElementById('box1').addEventListener('click', () => selectBox(1));
document.getElementById('box2').addEventListener('click', () => selectBox(2));
document.getElementById('nextBtn').addEventListener('click', nextRound);

// モード切替
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    gameMode = btn.dataset.mode;
  });
});
</script>
