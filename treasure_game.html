<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>どれが当たり？宝箱ゲーム</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Mochiy+Pop+One&display=swap');

  :root{
    --gold:#f5c842;
    --gold-dark:#b8860b;
    --pink:#ff6fa8;
    --safe:#3ec96b;
    --danger:#ff4757;
    --dark:#1a1035;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'Kosugi Maru',sans-serif;
    background:linear-gradient(160deg,#1e0a47 0%,#3a1f7a 40%,#5a2d9b 70%,#1a0838 100%);
    height:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:12px 12px 16px;position:relative;user-select:none;-webkit-user-select:none;
    transition:background .6s;
  }

  /* ===== ステージ背景 ===== */
  body[data-scene="s0"]{background:linear-gradient(180deg,#5fb8ea 0%,#a8e0ff 42%,#8fd27a 64%,#3f8f32 100%);}
  body[data-scene="s1"]{background:linear-gradient(180deg,#140d08 0%,#3d2a1c 45%,#4a3222 70%,#1e130b 100%);}
  body[data-scene="s2"]{background:linear-gradient(180deg,#1279b8 0%,#08508a 45%,#053766 75%,#021c38 100%);}
  .deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;transition:opacity .6s;}
  body[data-scene="s0"] .stars,body[data-scene="s1"] .stars,body[data-scene="s2"] .stars{opacity:0;}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 2.5s infinite alternate;}
  @keyframes twinkle{0%{opacity:.2;transform:scale(1);}100%{opacity:1;transform:scale(1.6);}}
  .cloud{position:absolute;background:#fff;border-radius:50px;opacity:.85;animation:drift 40s linear infinite;}
  .cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%;}
  .cloud::before{width:55%;height:160%;left:15%;top:-70%;}
  .cloud::after{width:40%;height:120%;left:50%;top:-45%;}
  @keyframes drift{from{transform:translateX(-30vw);}to{transform:translateX(130vw);}}
  .bubble{position:absolute;bottom:-20px;border:2px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(255,255,255,.12);animation:rise linear infinite;}
  @keyframes rise{from{transform:translateY(0);}to{transform:translateY(-110vh);}}
  .gem{position:absolute;animation:twinkle 1.8s infinite alternate;font-size:12px;}

  /* ===== ヘッダー ===== */
  .topbar{width:100%;max-width:400px;display:flex;align-items:center;justify-content:space-between;z-index:5;margin-bottom:6px;}
  .icon-btn{
    width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.35);
    background:rgba(0,0,0,.35);color:#fff;font-size:18px;cursor:pointer;-webkit-appearance:none;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:active{transform:scale(.9);}
  .header{text-align:center;z-index:5;}
  .title{
    font-family:'Mochiy Pop One',sans-serif;font-size:22px;color:var(--gold);
    text-shadow:0 0 16px rgba(245,200,66,.7),2px 2px 0 #5a3a00,0 0 4px #000;letter-spacing:2px;
  }
  .subtitle{font-size:12px;color:#fff;margin-top:2px;text-shadow:0 1px 3px rgba(0,0,0,.8);}

  /* ===== 宝の地図（進捗） ===== */
  .map{
    z-index:5;display:flex;align-items:center;gap:3px;margin:8px 0 10px;padding:6px 10px;
    background:linear-gradient(180deg,#f6e3b4,#e6c98a);border:2px solid #8b5a2b;border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 0 12px rgba(139,90,43,.35);
    max-width:100%;
  }
  .map .stg{font-size:13px;margin:0 1px;}
  .map .node{
    width:20px;height:20px;border-radius:50%;border:2px dashed #8b5a2b;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;color:#8b5a2b;background:rgba(255,255,255,.35);transition:all .4s;flex-shrink:0;
  }
  .map .node.done{background:radial-gradient(circle at 35% 35%,#fff3a0,#f5c842 50%,#b8860b);border:2px solid #8b5a2b;color:#5a3a00;}
  .map .node.current{border:2px solid #d62828;color:#d62828;animation:pulsePip .8s infinite alternate;}
  .map .node.goal{font-size:12px;border-style:solid;}
  @keyframes pulsePip{from{transform:scale(1);}to{transform:scale(1.2);}}
  .players{z-index:5;display:flex;gap:8px;margin:8px 0 10px;}
  .pchip{
    padding:6px 14px;border-radius:20px;font-family:'Mochiy Pop One',sans-serif;font-size:14px;color:#1a1035;
    opacity:.45;transition:all .3s;border:3px solid transparent;
  }
  .pchip.turn{opacity:1;transform:scale(1.12);border-color:#fff;box-shadow:0 0 14px rgba(255,255,255,.7);}

  .message{
    color:#fff;font-size:15px;text-align:center;margin-bottom:6px;min-height:34px;
    background:rgba(0,0,0,.45);padding:6px 16px;border-radius:20px;
    border:1px solid rgba(255,255,255,.2);z-index:5;
  }

  /* ===== アリーナ ===== */
  .arena{z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;flex:1;min-height:0;position:relative;}
  .boxes{position:relative;}
  .box{
    position:absolute;left:0;top:0;border:none;background:none;cursor:pointer;padding:0;
    -webkit-appearance:none;will-change:transform;
  }
  .box .chest{position:relative;width:100%;height:100%;transition:transform .15s;}
  .box:active .chest{transform:scale(.94);}
  .box svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));}
  .box .lid{transform-box:fill-box;transform-origin:8% 100%;transition:transform .35s cubic-bezier(.3,1.5,.5,1);}
  .box .inside{opacity:0;transition:opacity .2s;}
  .box.open .lid{transform:translate(-4px,-20px) rotate(-30deg);}
  .box.open .inside{opacity:1;}
  .box .content{
    position:absolute;left:-6%;width:112%;bottom:38%;z-index:3;pointer-events:none;
    transform:translateY(45%) scale(.2);opacity:0;
    transition:transform .45s cubic-bezier(.2,1.6,.4,1),opacity .2s;
  }
  .box .content img{width:100%;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));}
  .box.peekfx::after{
    content:'✨';position:absolute;left:50%;top:-30%;transform:translateX(-50%);font-size:28px;z-index:5;
    animation:sparkle .5s ease-in-out infinite alternate;pointer-events:none;
  }
  @keyframes sparkle{from{transform:translateX(-50%) scale(.8) rotate(-10deg);opacity:.7;}to{transform:translateX(-50%) scale(1.3) rotate(10deg);opacity:1;}}
  .box.open .content{transform:translateY(0) scale(1);opacity:1;}
  .box.dim .chest{opacity:.55;}
  .box.dim .content{opacity:.75;}
  .box.picked .chest{filter:drop-shadow(0 0 12px rgba(255,255,255,.9));}
  .box.tremble .chest{animation:tremble .09s linear infinite;}
  @keyframes tremble{0%{transform:translate(-2px,0) rotate(-2deg);}50%{transform:translate(2px,-1px) rotate(2deg);}100%{transform:translate(-2px,0) rotate(-2deg);}}
  .box.glow .chest{animation:glow 1s ease-in-out infinite;}
  @keyframes glow{
    0%,100%{filter:drop-shadow(0 0 4px rgba(255,215,0,.5));transform:scale(1);}
    50%{filter:drop-shadow(0 0 18px rgba(255,215,0,1)) drop-shadow(0 0 30px rgba(255,193,7,.6));transform:scale(1.06);}
  }
  .box .was{
    position:absolute;left:50%;top:-112%;transform:translateX(-50%);z-index:4;display:none;
    background:var(--danger);color:#fff;font-weight:700;font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap;
    animation:bob .5s infinite alternate;
  }
  .box.show-was .was{display:block;}
  @keyframes bob{from{margin-top:0;}to{margin-top:-6px;}}

  /* りす */
  #squirrel{position:absolute;left:0;top:0;z-index:6;pointer-events:none;display:none;}
  #squirrel .flip{transition:transform .15s;}
  #squirrel.left .flip{transform:scaleX(-1);}
  #squirrel svg{width:100%;display:block;animation:hop .28s ease-in-out infinite alternate;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));}
  @keyframes hop{from{transform:translateY(0);}to{transform:translateY(-5px);}}

  .pop-text{
    position:absolute;left:50%;top:50%;z-index:20;pointer-events:none;
    font-family:'Mochiy Pop One',sans-serif;font-size:48px;white-space:nowrap;
    color:var(--safe);text-shadow:0 0 20px var(--safe),3px 3px 0 #003d1a;
    transform:translate(-50%,-50%) scale(0);animation:popIn 1s cubic-bezier(.175,.885,.32,1.275) forwards;
  }
  @keyframes popIn{0%{transform:translate(-50%,-50%) scale(0);}25%{transform:translate(-50%,-50%) scale(1.1);}70%{transform:translate(-50%,-50%) scale(1);opacity:1;}100%{transform:translate(-50%,-80%) scale(1);opacity:0;}}

  /* アイテムバー */
  .itembar{z-index:5;display:flex;gap:6px;margin-top:6px;min-height:58px;align-items:center;}
  .item{
    min-width:70px;height:56px;border-radius:14px;border:2px solid rgba(255,255,255,.5);
    background:rgba(0,0,0,.5);color:#fff;font-size:16px;font-weight:700;cursor:pointer;
    -webkit-appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 6px;
    font-family:'Kosugi Maru',sans-serif;line-height:1.15;
  }
  .item .ic{font-size:17px;}
  .item .lbl{font-size:10px;font-weight:400;white-space:nowrap;margin-top:2px;}
  .item .lbl b{display:inline-block;margin-left:3px;padding:0 4px;border-radius:6px;background:rgba(255,255,255,.2);font-weight:700;}
  .item:disabled{opacity:.35;cursor:default;}
  .item.passive{cursor:default;}
  .item.ready{border-color:var(--gold);background:rgba(120,80,0,.6);animation:itemPulse .7s ease-in-out infinite alternate;}
  .item.ready .lbl b{background:var(--gold);color:#1a1035;}
  @keyframes itemPulse{from{transform:scale(1);box-shadow:0 0 6px rgba(245,200,66,.5);}to{transform:scale(1.1);box-shadow:0 0 18px rgba(245,200,66,1);}}
  .item.on{background:rgba(62,201,107,.55);border-color:var(--safe);}
  .item small{font-size:12px;}

  /* バナー・フラッシュ */
  .banner{
    position:fixed;left:50%;top:42%;z-index:150;pointer-events:none;text-align:center;
    font-family:'Mochiy Pop One',sans-serif;font-size:30px;color:#fff;white-space:normal;
    width:max-content;max-width:92vw;padding:14px 24px;border-radius:24px;background:rgba(10,0,30,.8);border:3px solid var(--gold);
    box-shadow:0 0 30px rgba(245,200,66,.6);
    transform:translate(-50%,-50%) scale(0);transition:transform .35s cubic-bezier(.175,.885,.32,1.275);
  }
  .banner.show{transform:translate(-50%,-50%) scale(1);}
  .banner.super{color:#fff200;border-color:#fff200;background:rgba(120,0,0,.85);box-shadow:0 0 40px #ff0;animation:superShake .1s infinite;}
  @keyframes superShake{0%{margin-left:-3px;}50%{margin-left:3px;}100%{margin-left:-3px;}}
  .banner.stage{background:rgba(0,0,0,.7);}
  .banner .sub{display:block;font-family:'Kosugi Maru',sans-serif;font-size:14px;margin-top:6px;color:rgba(255,255,255,.9);white-space:normal;}
  .banner .big-icon{display:block;font-size:56px;line-height:1.2;}
  .ask{position:fixed;inset:0;z-index:160;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:20px;}
  .ask.show{display:flex;}
  .ask-card{
    background:rgba(10,0,30,.92);border:3px solid var(--gold);border-radius:24px;padding:20px 22px;text-align:center;color:#fff;
    box-shadow:0 0 30px rgba(245,200,66,.6);max-width:92vw;animation:askIn .3s cubic-bezier(.175,.885,.32,1.275);
  }
  @keyframes askIn{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
  .ask-title{font-family:'Mochiy Pop One',sans-serif;font-size:26px;}
  .ask-sub{font-size:13px;margin:8px 0 16px;color:rgba(255,255,255,.9);}
  .ask-btns{display:flex;gap:10px;justify-content:center;}
  .ask-btns button{
    padding:12px 22px;border-radius:30px;font-family:'Mochiy Pop One',sans-serif;font-size:16px;cursor:pointer;-webkit-appearance:none;
  }
  .ask-yes{border:none;background:linear-gradient(135deg,var(--gold),#e89500);color:#1a1035;box-shadow:0 4px 14px rgba(245,200,66,.5);}
  .ask-no{border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;}
  .flash{position:fixed;inset:0;background:#fff;z-index:140;pointer-events:none;opacity:0;}
  .flash.on{animation:flash .5s ease-out;}
  @keyframes flash{0%{opacity:.95;}100%{opacity:0;}}
  .curtain{position:fixed;inset:0;background:#000;z-index:145;pointer-events:none;opacity:0;transition:opacity .4s;}
  .curtain.on{opacity:1;}

  /* ===== リザルト ===== */
  .overlay{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:100;opacity:0;pointer-events:none;transition:opacity .4s;padding:20px;
  }
  .overlay.show{opacity:1;pointer-events:all;}
  .overlay.lose-bg{background:rgba(40,5,5,.92);}
  .overlay.goal-bg{background:radial-gradient(circle at 50% 45%,rgba(120,60,0,.55),rgba(10,0,30,.75) 70%);}
  .overlay.goal-bg .result-img-wrap{background:transparent;box-shadow:none;overflow:visible;position:relative;}
  .overlay.goal-bg .result-img-wrap::before{
    content:'';position:absolute;inset:-55%;z-index:-1;border-radius:50%;
    background:repeating-conic-gradient(rgba(255,215,0,.45) 0deg 9deg,rgba(255,215,0,0) 9deg 18deg);
    -webkit-mask-image:radial-gradient(circle,#000 25%,transparent 70%);mask-image:radial-gradient(circle,#000 25%,transparent 70%);
    animation:spin 10s linear infinite;
  }
  .overlay.goal-bg .result-img-wrap::after{
    content:'';position:absolute;inset:-10%;z-index:-1;border-radius:50%;
    background:radial-gradient(circle,rgba(255,240,150,.8),rgba(255,200,60,0) 70%);
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .overlay.goal-bg .result-img{animation:banzai .8s ease-in-out infinite alternate;transform-origin:bottom center;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));}
  .trophy{display:none;font-size:44px;line-height:1;margin-bottom:4px;animation:trophy 1s ease-in-out infinite alternate;filter:drop-shadow(0 0 12px rgba(255,215,0,.9));}
  .overlay.goal-bg .trophy{display:block;}
  @keyframes trophy{from{transform:rotate(-8deg) scale(1);}to{transform:rotate(8deg) scale(1.15);}}
  #confCanvas{position:fixed;inset:0;pointer-events:none;z-index:101;}
  .result-img-wrap{
    width:220px;height:220px;border-radius:24px;overflow:hidden;margin-bottom:14px;transform:scale(0);
    transition:transform .5s cubic-bezier(.175,.885,.32,1.275);
    background:rgba(255,255,255,.95);box-shadow:0 12px 40px rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;
  }
  .overlay.show .result-img-wrap{transform:scale(1);}
  .result-img{width:100%;height:100%;object-fit:contain;}
  .result-text{
    font-family:'Mochiy Pop One',sans-serif;font-size:52px;font-weight:900;letter-spacing:3px;
    transform:scale(0);transition:transform .4s .2s cubic-bezier(.175,.885,.32,1.275);text-align:center;
  }
  .overlay.show .result-text{transform:scale(1);}
  .result-text.lose{color:var(--danger);text-shadow:0 0 24px var(--danger),3px 3px 0 #5a0000;font-size:36px;letter-spacing:1px;white-space:nowrap;}
  .result-text.goal{color:var(--gold);text-shadow:0 0 30px var(--gold),3px 3px 0 #5a3a00;font-size:64px;animation:goalPulse 1s infinite alternate;}
  @keyframes goalPulse{from{transform:scale(1);}to{transform:scale(1.08);}}
  .goal-sub{
    font-size:16px;color:rgba(255,255,255,.95);margin-top:8px;text-align:center;line-height:1.6;
    transform:scale(0);transition:transform .4s .3s cubic-bezier(.175,.885,.32,1.275);font-weight:700;
  }
  .overlay.show .goal-sub{transform:scale(1);}
  .goal-sub .newrec{display:block;color:var(--gold);font-size:22px;font-family:'Mochiy Pop One',sans-serif;}
  .btn-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center;}
  .next-btn{
    padding:13px 26px;font-family:'Mochiy Pop One',sans-serif;font-size:16px;
    border:none;border-radius:50px;cursor:pointer;
    background:linear-gradient(135deg,var(--gold),#e89500);color:#1a1035;
    box-shadow:0 6px 18px rgba(245,200,66,.45);
    transform:scale(0);transition:transform .4s .4s cubic-bezier(.175,.885,.32,1.275);-webkit-appearance:none;
  }
  .next-btn.sub-btn{background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.5);box-shadow:none;}
  .overlay.show .next-btn{transform:scale(1);}
  .next-btn:active{transform:scale(.93) !important;}

  .congrats-balloon{
    font-family:'Mochiy Pop One',sans-serif;font-size:34px;font-weight:900;letter-spacing:2px;color:#1a1035;
    background:linear-gradient(135deg,#ffe066,#f5c842,#e89500);padding:12px 32px;border-radius:50px;border:4px solid #fff;
    box-shadow:0 0 30px rgba(245,200,66,.8),0 6px 20px rgba(0,0,0,.4);margin-bottom:14px;position:relative;
    animation:congratsBounce .6s ease-in-out infinite alternate;white-space:nowrap;
  }
  .congrats-balloon::after{
    content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);width:0;height:0;
    border-left:14px solid transparent;border-right:14px solid transparent;border-top:14px solid #f5c842;
  }
  @keyframes congratsBounce{0%{transform:scale(1) rotate(-2deg);}100%{transform:scale(1.08) rotate(2deg);}}
  .celebration{
    display:none;gap:12px;align-items:flex-end;justify-content:center;margin-bottom:16px;opacity:0;
    transform:translateY(120px);transition:transform .6s cubic-bezier(.175,.885,.32,1.275),opacity .6s;
  }
  .chara-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .chara-img{width:100px;height:100px;object-fit:contain;transform-origin:bottom center;animation:banzai .7s ease-in-out infinite alternate;}
  .chara-wrap:nth-child(2) .chara-img{animation-delay:.2s;}
  @keyframes banzai{0%{transform:translateY(0) rotate(-4deg) scaleY(1);}40%{transform:translateY(-14px) rotate(0) scaleY(1.05);}100%{transform:translateY(-22px) rotate(4deg) scaleY(1.08);}}
  .chara-speech{
    font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff6fa8,#ff4fa0);
    padding:3px 8px;border-radius:10px;white-space:nowrap;animation:speechPop .6s infinite alternate;
  }
  .chara-wrap:nth-child(2) .chara-speech{background:linear-gradient(135deg,#4ecdc4,#2ab5ab);}
  @keyframes speechPop{0%{transform:scale(1);}100%{transform:scale(1.1);}}

  #fwCanvas,#particleCanvas{position:fixed;inset:0;pointer-events:none;}
  #fwCanvas{z-index:99;}
  #particleCanvas{z-index:50;}

  /* ===== スタート画面 ===== */
  .start-screen{
    position:fixed;inset:0;background:linear-gradient(160deg,#1e0a47,#3a1f7a,#1a0838);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:200;padding:20px;text-align:center;transition:opacity .5s,transform .5s;overflow-y:auto;
  }
  .start-screen.hide{opacity:0;pointer-events:none;transform:scale(1.1);}
  .start-title{
    font-family:'Mochiy Pop One',sans-serif;font-size:30px;color:var(--gold);
    text-shadow:0 0 20px rgba(245,200,66,.7),3px 3px 0 #5a3a00;margin-bottom:6px;letter-spacing:2px;line-height:1.3;
  }
  .start-sub{font-size:14px;color:rgba(255,255,255,.85);margin-bottom:16px;}
  .start-rules{
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:14px;
    padding:12px 18px;color:#fff;font-size:13px;text-align:left;margin-bottom:10px;line-height:1.8;
    width:100%;max-width:310px;list-style:none;
  }
  .record{font-size:12px;color:var(--gold);margin-bottom:14px;min-height:18px;}
  .mode-select{
    display:flex;gap:4px;margin-bottom:12px;background:rgba(255,255,255,.08);border-radius:30px;padding:4px;
    border:1px solid rgba(255,255,255,.15);
  }
  .mode-btn,.pl-btn{
    padding:8px 14px;font-family:'Kosugi Maru',sans-serif;font-size:13px;font-weight:700;
    border:none;border-radius:25px;cursor:pointer;background:transparent;color:rgba(255,255,255,.6);
    transition:all .25s;-webkit-appearance:none;
  }
  .mode-btn.active,.pl-btn.active{background:linear-gradient(135deg,#f5c842,#e89500);color:#1a1035;box-shadow:0 3px 10px rgba(245,200,66,.4);}
  .mode-btn small{display:block;font-size:10px;font-weight:400;margin-top:1px;}
  .player-select{display:none;align-items:center;gap:6px;margin-bottom:12px;color:#fff;font-size:13px;}
  .player-select.show{display:flex;}
  .pl-btn{background:rgba(255,255,255,.08);padding:8px 16px;}
  .start-btn{
    padding:15px 50px;font-family:'Mochiy Pop One',sans-serif;font-size:20px;border:none;border-radius:50px;cursor:pointer;
    background:linear-gradient(135deg,var(--gold),#e89500);color:#1a1035;box-shadow:0 8px 24px rgba(245,200,66,.5);
    animation:pulseBtn 1.2s infinite alternate;-webkit-appearance:none;margin-bottom:16px;
  }
  @keyframes pulseBtn{from{transform:scale(1);}to{transform:scale(1.08);}}
  .start-btn:active{transform:scale(.95) !important;}
  .settings{display:flex;gap:10px;}
  .toggle{
    padding:7px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);
    color:#fff;font-family:'Kosugi Maru',sans-serif;font-size:13px;cursor:pointer;-webkit-appearance:none;
  }
  .toggle.on{background:rgba(62,201,107,.35);border-color:var(--safe);}

  @media (max-height:640px){
    .title{font-size:18px;}
    .map .node{width:17px;height:17px;font-size:9px;}
    .result-img-wrap{width:170px;height:170px;}
    .result-text{font-size:42px;}
    .result-text.lose{font-size:30px;}
    .start-title{font-size:24px;}
    .start-rules{line-height:1.6;}
    .banner{font-size:24px;}
  }
  @media (max-height:760px){
    .overlay.goal-bg .result-img-wrap{width:120px;height:120px;margin-bottom:6px;}
    .result-text.goal{font-size:44px;}
    .congrats-balloon{font-size:22px;padding:8px 20px;margin-bottom:8px;}
    .chara-img{width:60px;height:60px;}
    .celebration{margin-bottom:8px;}
    .trophy{font-size:30px;}
    .goal-sub{font-size:13px;}
    .btn-row{margin-top:10px;flex-wrap:nowrap;gap:8px;}
    .next-btn{padding:10px 16px;font-size:14px;}
    .overlay{padding:10px;}
    .chara-speech{font-size:10px;padding:2px 6px;}
  }
</style>
</head>
<body data-scene="space">

<!-- 宝箱SVG用の共通グラデーション -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8a166"/><stop offset="50%" stop-color="#a86932"/><stop offset="100%" stop-color="#5e3818"/>
    </linearGradient>
    <linearGradient id="gLid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0a878"/><stop offset="100%" stop-color="#8a4f24"/>
    </linearGradient>
  </defs>
</svg>

<div class="stars" id="stars"></div>
<div class="deco" id="deco"></div>
<canvas id="particleCanvas"></canvas>
<canvas id="fwCanvas"></canvas>
<canvas id="confCanvas"></canvas>
<div class="flash" id="flash"></div>
<div class="curtain" id="curtain"></div>
<div class="banner" id="banner"></div>
<div class="ask" id="askSlow">
  <div class="ask-card">
    <div class="ask-title" id="askTitle"></div>
    <div class="ask-sub" id="askSub"></div>
    <div class="ask-btns">
      <button class="ask-yes" id="askYes" type="button"></button>
      <button class="ask-no" id="askNo" type="button"></button>
    </div>
  </div>
</div>

<!-- スタート画面 -->
<div class="start-screen" id="startScreen">
  <div class="start-title" data-t="titleBig">🎁<br>どれが当たり？</div>
  <div class="start-sub" data-t="sub">宝箱タップゲーム</div>
  <div class="mode-select" id="modeSelect">
    <button class="mode-btn" data-mode="easy"><span data-t="mEasy"></span><small data-t="mEasyS"></small></button>
    <button class="mode-btn active" data-mode="normal"><span data-t="mNormal"></span><small data-t="mNormalS"></small></button>
    <button class="mode-btn" data-mode="party"><span data-t="mParty"></span><small data-t="mPartyS"></small></button>
  </div>
  <div class="player-select" id="playerSelect">
    <span data-t="players"></span>
    <button class="pl-btn active" data-pl="2">2</button>
    <button class="pl-btn" data-pl="3">3</button>
    <button class="pl-btn" data-pl="4">4</button>
  </div>
  <ul class="start-rules" id="rules"></ul>
  <div class="record" id="recordLine"></div>
  <button class="start-btn" id="startBtn" data-t="start">▶ スタート</button>
  <div class="settings">
    <button class="toggle" id="soundToggle"></button>
    <button class="toggle" id="kanaToggle"></button>
  </div>
</div>

<!-- ゲーム画面 -->
<div class="topbar">
  <button class="icon-btn" id="homeBtn" aria-label="タイトルへ">🏠</button>
  <div class="header">
    <div class="title" data-t="title">🎁 どれが当たり？ 🎁</div>
    <div class="subtitle" id="stageLabel"></div>
  </div>
  <button class="icon-btn" id="soundBtn" aria-label="音の切り替え">🔊</button>
</div>
<div class="map" id="map"></div>
<div class="players" id="players" style="display:none"></div>
<div class="message" id="messageBox"></div>

<div class="arena" id="arena">
  <div class="boxes" id="boxes"></div>
</div>
<div class="itembar" id="itembar"></div>

<!-- リザルト -->
<div class="overlay" id="resultOverlay">
  <div class="celebration" id="celebration">
    <div class="chara-wrap">
      <img class="chara-img" id="charaMax" src="" alt="">
      <div class="chara-speech" data-t="yattane">やったね！</div>
    </div>
    <div class="chara-wrap">
      <img class="chara-img" id="charaSmall" src="" alt="">
      <div class="chara-speech" data-t="sugoi">すごい！</div>
    </div>
  </div>
  <div class="congrats-balloon" id="congratsBalloon" style="display:none;" data-t="congrats">おめでとう！</div>
  <div class="trophy">🏆</div>
  <div class="result-img-wrap"><img class="result-img" id="resultImg" src="" alt=""></div>
  <div class="result-text" id="resultText"></div>
  <div class="goal-sub" id="goalSub"></div>
  <div class="btn-row">
    <button class="next-btn" id="againBtn" data-t="again">もう一度遊ぶ</button>
    <button class="next-btn sub-btn" id="titleBtn" data-t="toTitle">タイトルへ</button>
  </div>
</div>

// ===== 保存データ（端末のブラウザ内） =====
const STORE_KEY = 'treasure_game_v2';
function loadStore() {
  try {
    const o = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
  } catch (e) { return {}; }
}
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
}
const store = loadStore();
function num(v) { return (Number.isFinite(v) && v >= 0) ? Math.min(Math.floor(v), 99999) : 0; }
function getRec(mode) {
  const r = (store[mode] && typeof store[mode] === 'object') ? store[mode] : {};
  return { best: Math.min(num(r.best), TOTAL), plays: num(r.plays), goals: num(r.goals) };
}
let soundOn = store.sound !== false;
let kana = store.kana === true;

function t(k, ...a) {
  let s = TX[k][kana ? 1 : 0];
  a.forEach((v, i) => { s = s.replace('{' + i + '}', v); });
  return s;
}
function applyTexts() {
  document.querySelectorAll('[data-t]').forEach(e => {
    const s = t(e.dataset.t);
    if (s.includes('\n')) {
      e.textContent = '';
      s.split('\n').forEach((line, i) => { if (i) e.appendChild(document.createElement('br')); e.appendChild(document.createTextNode(line)); });
    } else e.textContent = s;
  });
  renderRules(); renderRecord(); renderToggles();
  if (G.phase !== 'idle') { renderStageLabel(); }
}

// ===== 宝箱の配置 =====
function calcSlots(n, cols) {
  const W = Math.min(390, window.innerWidth - 20);
  const slot = W / cols;
  const bw = Math.floor(Math.min(105, slot - 10));
  const rows = Math.ceil(n / cols);
  const top = Math.round(bw * 0.95);          // 中身が飛び出す余白
  const rowH = bw + top;
  const slots = [];
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / cols), c = i % cols;
    const inRow = Math.min(cols, n - r * cols);
    const off = (cols - inRow) * slot / 2;
    slots.push({ x: Math.round(off + c * slot + (slot - bw) / 2), y: r * rowH + top });
  }
  return { W, bw, h: rows * rowH + 8, slots };
}
function buildBoxes(n, cols) {
  const wrap = $('boxes');
  wrap.innerHTML = '';
  G.boxes = [];
  G.cols = cols;
  const L = calcSlots(n, cols);
  wrap.style.width = L.W + 'px';
  wrap.style.height = L.h + 'px';
  G.boxW = L.bw;
  for (let i = 0; i < n; i++) {
    const el = document.createElement('button');
    el.className = 'box';
    el.type = 'button';
    el.style.width = L.bw + 'px';
    el.style.height = L.bw + 'px';
    el.setAttribute('aria-label', '宝箱');
    el.innerHTML = `<div class="content"><img alt=""></div><div class="chest">${CHEST_SVG}</div><div class="was"></div>`;
    const b = { el, x: 0, y: 0, treasure: false, hazard: false, opened: false };
    setPos(b, L.slots[i].x, L.slots[i].y);
    el.addEventListener('click', () => onBoxTap(b));
    wrap.appendChild(el);
    G.boxes.push(b);
  }
  const sq = document.createElement('div');
  sq.id = 'squirrel';
  sq.innerHTML = `<div class="flip">${SQUIRREL_SVG}</div>`;
  wrap.appendChild(sq);
}
function setPos(b, x, y) {
  b.x = x; b.y = y;
  b.el.style.transform = `translate(${x}px,${y}px)`;
}
// 画面サイズ変更時：並び順を保って再配置
function relayout() {
  if (!G.boxes.length || G.busy) return;
  const L = calcSlots(G.boxes.length, G.cols);
  const wrap = $('boxes');
  wrap.style.width = L.W + 'px';
  wrap.style.height = L.h + 'px';
  G.boxW = L.bw;
  const sorted = [...G.boxes].sort((a, b) => (a.y - b.y) || (a.x - b.x));
  sorted.forEach((b, i) => {
    b.el.style.width = L.bw + 'px';
    b.el.style.height = L.bw + 'px';
    setPos(b, L.slots[i].x, L.slots[i].y);
  });
}

// ===== 入れかえアニメ =====
function swapAnim(a, b, dur) {
  const ax = a.x, ay = a.y, bx = b.x, by = b.y;
  const mx = (ax + bx) / 2, my = (ay + by) / 2;
  const lift = Math.min(40, G.boxW * 0.35);
  const o = { duration: dur, easing: 'ease-in-out' };
  a.el.style.zIndex = 2; b.el.style.zIndex = 1;
  const p1 = a.el.animate([
    { transform: `translate(${ax}px,${ay}px)` },
    { transform: `translate(${mx}px,${my - lift}px)` },
    { transform: `translate(${bx}px,${by}px)` }], o).finished;
  const p2 = b.el.animate([
    { transform: `translate(${bx}px,${by}px)` },
    { transform: `translate(${mx}px,${my + lift * 0.4}px)` },
    { transform: `translate(${ax}px,${ay}px)` }], o).finished;
  setPos(a, bx, by); setPos(b, ax, ay);
  return Promise.all([p1, p2]);
}
function randomPair() {
  const n = G.boxes.length;
  const i = rand(n);
  const j = (i + 1 + rand(n - 1)) % n;
  return [G.boxes[i], G.boxes[j]];
}

// りすの移動
function sqPos(sq) { return { x: +sq.dataset.x || 0, y: +sq.dataset.y || 0 }; }
function sqSet(sq, x, y) { sq.dataset.x = x; sq.dataset.y = y; sq.style.transform = `translate(${x}px,${y}px)`; }
function sqMove(sq, x, y, dur) {
  const p = sqPos(sq);
  sq.classList.toggle('left', x < p.x);
  const a = sq.animate([{ transform: `translate(${p.x}px,${p.y}px)` }, { transform: `translate(${x}px,${y}px)` }],
    { duration: dur, easing: 'ease-in-out' }).finished;
  sqSet(sq, x, y);
  return a;
}
async function easyShuffle(st, slow, id) {
  const sq = $('squirrel');
  const bw = G.boxW;
  const sw = Math.round(bw * 0.72);
  sq.style.width = sw + 'px';
  const offY = -sw * 0.92;
  const startY = G.boxes[0].y + offY;
  sqSet(sq, -sw - 10, startY);
  sq.style.display = 'block';
  const carry = slow ? EASY_CARRY_MS * 1.6 : EASY_CARRY_MS;
  const times = EASY_SWAPS[st];
  for (let i = 0; i < times; i++) {
    const [a, b] = randomPair();
    await sqMove(sq, a.x + (bw - sw) / 2, a.y + offY, 650);
    if (!alive(id)) return;
    await sleep(150);
    // a を持ち上げて b の位置へ、b は a の位置へすべる
    const ax = a.x, ay = a.y, bx = b.x, by = b.y;
    const lift = bw * 0.4;
    a.el.style.zIndex = 2; b.el.style.zIndex = 1;
    sq.classList.toggle('left', bx < ax);
    const o = { duration: carry, easing: 'ease-in-out' };
    const kA = [
      { transform: `translate(${ax}px,${ay}px)`, offset: 0 },
      { transform: `translate(${ax}px,${ay - lift}px)`, offset: .2 },
      { transform: `translate(${bx}px,${by - lift}px)`, offset: .8 },
      { transform: `translate(${bx}px,${by}px)`, offset: 1 }];
    const kS = kA.map(k => {
      const m = k.transform.match(/translate\(([-\d.]+)px,([-\d.]+)px\)/);
      return { transform: `translate(${+m[1] + (bw - sw) / 2}px,${+m[2] + offY}px)`, offset: k.offset };
    });
    const kB = [
      { transform: `translate(${bx}px,${by}px)`, offset: 0 },
      { transform: `translate(${bx}px,${by}px)`, offset: .2 },
      { transform: `translate(${ax}px,${ay}px)`, offset: .8 },
      { transform: `translate(${ax}px,${ay}px)`, offset: 1 }];
    const p = Promise.all([a.el.animate(kA, o).finished, b.el.animate(kB, o).finished, sq.animate(kS, o).finished]);
    setPos(a, bx, by); setPos(b, ax, ay);
    sqSet(sq, bx + (bw - sw) / 2, by + offY);
    soundStep();
    await p;
    if (!alive(id)) return;
    await sleep(200);
  }
  const W = parseFloat($('boxes').style.width);
  await sqMove(sq, W + 10, sqPos(sq).y, 600);
  sq.style.display = 'none';
}
async function normalShuffle(st, slow, id) {
  let { k, d } = NORMAL_SHUFFLE[st];
  if (!G.superUsed && Math.random() < SUPER_RATE) {
    G.superUsed = true;
    flash();
    soundAlarm();
    await showBanner(t('superFast'), 'super', 1400);
    if (!alive(id)) return;
    k += 4;
    d = Math.max(110, Math.round(d / 3));
  }
  if (slow) d = Math.round(d * 2);
  msg(slow ? t('slowing') : t('shuffling'));
  for (let i = 0; i < k; i++) {
    const [a, b] = randomPair();
    soundSwish();
    await swapAnim(a, b, d);
    if (!alive(id)) return;
  }
}

// ===== オーディオ =====
let audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { audioCtx = null; }
  return audioCtx;
}
function playTone(freq, dur, type = 'sine', vol = 0.3, delay = 0) {
  if (!soundOn) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur);
}
function playGlide(f1, f2, dur, type = 'sine', vol = 0.3, delay = 0) {
  if (!soundOn) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f1, t0);
  osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur);
}
function soundTap() { playTone(800, 0.05, 'square', 0.15); }
function soundOpen() { playGlide(300, 900, 0.18, 'triangle', 0.2); }
function soundClose() { playGlide(500, 200, 0.12, 'triangle', 0.15); }
function soundSwish() { playGlide(250, 520, 0.08, 'sine', 0.08); }
function soundStep() { [0, .15, .3, .45].forEach(d => playTone(600 + rand(200), 0.05, 'triangle', 0.1, d)); }
function soundDrum() { for (let i = 0; i < 6; i++) playTone(140 + i * 10, 0.06, 'triangle', 0.25, i * 0.1); }
function soundAlarm() { [0, .18, .36].forEach(d => playGlide(600, 1200, 0.15, 'square', 0.12, d)); }
function soundItem() { [784, 988, 1175, 1568].forEach((n, i) => playTone(n, 0.15, 'triangle', 0.25, i * 0.08)); }
function soundWin() {
  playTone(523, 0.12, 'sine', 0.3, 0); playTone(659, 0.12, 'sine', 0.3, 0.08);
  playTone(784, 0.12, 'sine', 0.3, 0.16); playTone(1047, 0.25, 'sine', 0.35, 0.24);
  playTone(1047, 0.08, 'triangle', 0.2, 0.5); playTone(1319, 0.3, 'sine', 0.3, 0.55);
}
function soundLose() { playGlide(400, 100, 0.5, 'sawtooth', 0.25, 0); playGlide(350, 80, 0.5, 'sawtooth', 0.2, 0.1); }
function soundGoal() {
  // ファンファーレ（2フレーズ）
  const p1 = [523, 659, 784, 1047, 784, 1047, 1319];
  p1.forEach((n, i) => playTone(n, 0.18, 'triangle', 0.3, i * 0.12));
  let t0 = p1.length * 0.12;
  playTone(1568, 0.5, 'triangle', 0.35, t0);
  playTone(1047, 0.5, 'sine', 0.3, t0);
  t0 += 0.6;
  const p2 = [[784, .15], [784, .15], [784, .15], [1047, .45], [880, .15], [988, .15], [1047, .7]];
  p2.forEach(([n, d]) => { playTone(n, d + 0.05, 'triangle', 0.3, t0); playTone(n / 2, d + 0.05, 'sine', 0.18, t0); t0 += d; });
  [523, 659, 784, 1047].forEach(n => playTone(n, 1.0, 'sine', 0.18, t0));
}
function soundFirework() {
  if (!soundOn) return;
  const ctx = ensureAudio(); if (!ctx) return;
  playGlide(200, 1200, 0.4, 'sine', 0.15, 0);
  setTimeout(() => {
    if (!soundOn) return;
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.4, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    src.connect(gain).connect(ctx.destination);
    src.start();
  }, 400);
}

// ===== パーティクル =====
function burstParticles(el, isWin) {
  const canvas = $('particleCanvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = isWin ? ['#ffd700', '#3ec96b', '#4ecdc4', '#fff', '#ff6fa8'] : ['#666', '#888', '#444', '#a0a0a0'];
  const ps = Array.from({ length: 28 }, () => ({
    x: cx, y: cy, vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 1.4) * 11,
    r: Math.random() * 5 + 3, color: pick(colors), life: 1, decay: 0.025 + Math.random() * 0.025,
    rot: Math.random() * Math.PI * 2, vrot: (Math.random() - 0.5) * 0.3, shape: Math.random() < 0.5 ? 'circle' : 'square'
  }));
  (function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of ps) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.45; p.life -= p.decay; p.rot += p.vrot;
      if (p.life <= 0) continue;
      alive = true;
      ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.shape === 'circle') { ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (alive) requestAnimationFrame(draw); else ctx.clearRect(0, 0, canvas.width, canvas.height);
  })();
}

// ===== ひとりで：ラウンド進行 =====
async function startRound() {
  const id = G.gid;
  const st = stageOf(G.round);
  const n = STAGES[st].boxes;
  G.phase = 'show';
  G.busy = true;
  if (G.boxes.length !== n) buildBoxes(n, n);
  resetBoxes();
  renderMap(); renderStageLabel(); renderItems();
  const tb = pick(G.boxes);
  tb.treasure = true;
  G.treasure = tb;
  G.boxes.forEach(b => setContent(b, b.treasure ? IMG_WIN : pick(IMG_LOSE), b.treasure ? 'win' : 'lose'));
  guideMsg(t('watch'));
  await sleep(500); if (!alive(id)) return;
  tb.el.classList.add('open'); soundOpen();
  await sleep(G.mode === 'easy' ? 2000 : 1300); if (!alive(id)) return;
  tb.el.classList.remove('open'); soundClose();
  await sleep(550); if (!alive(id)) return;
  let slow = false;
  if (G.items.slow > 0) {
    G.phase = 'ask'; renderItems();
    slow = await askSlow();
    if (!alive(id)) return;
    if (slow) { G.items.slow--; soundItem(); }
  }
  G.phase = 'shuffle'; renderItems();
  if (G.mode === 'easy') { msg(slow ? t('slowing') : t('carrying')); await easyShuffle(st, slow, id); }
  else await normalShuffle(st, slow, id);
  if (!alive(id)) return;
  G.busy = false;
  G.phase = 'choose';
  renderItems();
  guideMsg(t('which'));
  if (G.mode === 'easy' && G.hints > 0) {
    clearTimeout(G.hintTimer);
    G.hintTimer = setTimeout(() => {
      if (!alive(id) || G.phase !== 'choose' || G.hints <= 0) return;
      G.hints--;
      G.treasure.el.classList.add('glow');
      renderItems();
    }, HINT_DELAY);
  }
}

async function onBoxTap(b) {
  if (G.mode === 'party') return partyTap(b);
  if (G.phase !== 'choose') return;
  const id = G.gid;
  G.phase = 'reveal';
  clearTimeout(G.hintTimer);
  G.boxes.forEach(x => x.el.classList.remove('glow'));
  renderItems();
  soundTap(); soundDrum();
  msg(t('opening'));
  b.el.classList.add('tremble', 'picked');
  await sleep(700); if (!alive(id)) return;
  b.el.classList.remove('tremble');
  b.el.classList.add('open'); soundOpen();
  await sleep(500); if (!alive(id)) return;
  // 選ばなかった箱も開けて中身を見せる
  G.boxes.forEach(x => { if (x !== b) x.el.classList.add('open', 'dim'); });
  if (b.treasure) {
    burstParticles(b.el, true); soundWin();
    popText(t('safe'));
    G.round++;
    await afterWin(id);
  } else if (G.items.shield > 0) {
    // 盾：同じラウンドを最初からやり直し（ラウンドは進まない）
    G.items.shield--;
    G.treasure.el.classList.remove('dim');
    G.treasure.el.classList.add('show-was');
    G.treasure.el.querySelector('.was').textContent = t('was');
    renderItems();
    soundItem();
    await sleep(700); if (!alive(id)) return;
    await showBanner(`<span class="big-icon">🛡</span>${t('shieldRetry')}<span class="sub">${t('shieldRetrySub')}</span>`, '', 1900);
    if (!alive(id)) return;
    startRound();
  } else {
    G.treasure.el.classList.remove('dim');
    G.treasure.el.classList.add('show-was');
    G.treasure.el.querySelector('.was').textContent = t('was');
    burstParticles(b.el, false); soundLose();
    await sleep(1300); if (!alive(id)) return;
    const img = b.el.querySelector('.content img').src;
    showLose(img);
  }
}

async function afterWin(id) {
  renderMap();
  if (G.round >= TOTAL) {
    await sleep(700); if (!alive(id)) return;
    showGoal();
    return;
  }
  if (G.round % 3 === 0) {
    await sleep(900); if (!alive(id)) return;
    // 同じアイテムは1個まで：持っていないものから選ぶ
    const cand = ['shield', 'peek', 'slow'].filter(k => G.items[k] === 0);
    if (cand.length) {
      const it = pick(cand);
      G.items[it] = 1;
      renderItems();
      soundItem();
      await showBanner(`<span class="big-icon">${ITEM_ICON[it]}</span>${t('itemGet')}<span class="sub">${t('i_' + it)}<br>👉 ${t('u_' + it)}</span>`, '', 3000);
    } else {
      await showBanner(`<span class="big-icon">🎒</span>${t('itemFull')}`, '', 1800);
    }
    if (!alive(id)) return;
    await changeStage(stageOf(G.round), id);
  } else {
    await waitOrTap(1200);
  }
  if (!alive(id)) return;
  startRound();
}

async function changeStage(st, id) {
  const c = $('curtain');
  c.classList.add('on');
  await sleep(450); if (!alive(id)) { c.classList.remove('on'); return; }
  setScene(STAGES[st].scene);
  const n = STAGES[st].boxes;
  if (G.boxes.length !== n) buildBoxes(n, n);
  resetBoxes();
  renderStageLabel(); renderMap();
  c.classList.remove('on');
  await showBanner(`${STAGES[st].icon} ${t('stage', st + 1, t('sn' + st))}`, 'stage', 1400);
}

function useItem(key) {
  if (G.mode === 'party') return;
  if (key === 'peek') {
    if (G.items.peek <= 0 || G.phase !== 'choose') return;
    G.items.peek--;
    soundItem();
    const el = G.treasure.el;
    el.classList.add('glow', 'peekfx');
    setTimeout(() => el.classList.remove('peekfx'), 1500);
    setTimeout(() => { if (G.phase === 'choose') el.classList.remove('glow'); }, 1500);
    renderItems();
    guideMsg(t('which'));
  }
  // 🐢スローはシャッフル前の確認画面でのみ使う
}

// 🐢スロー確認（つかう→true／つかわない→false）
function askSlow() {
  return new Promise(res => {
    const box = $('askSlow');
    $('askTitle').textContent = t('askSlow');
    $('askSub').textContent = t('askSlowSub', G.items.slow);
    $('askYes').textContent = t('askYes');
    $('askNo').textContent = t('askNo');
    const done = v => { box.classList.remove('show'); $('askYes').onclick = $('askNo').onclick = null; G.askResolve = null; res(v); };
    $('askYes').onclick = () => done(true);
    $('askNo').onclick = () => done(false);
    G.askResolve = done;
    box.classList.add('show');
  });
}

// ===== みんなで =====
function startParty() {
  setScene('space');
  buildBoxes(PARTY_BOXES, 3);
  resetBoxes();
  const hz = pick(G.boxes);
  hz.hazard = true;
  G.boxes.forEach(b => setContent(b, b.hazard ? pick(IMG_LOSE) : IMG_WIN, b.hazard ? 'lose' : 'win'));
  G.turn = 0;
  G.phase = 'choose';
  G.busy = false;
  renderPlayers(); renderStageLabel(); renderItems();
  msg(t('turn', (G.turn + 1) + 'P'));
}
async function partyTap(b) {
  if (G.phase !== 'choose' || b.opened) return;
  const id = G.gid;
  G.phase = 'reveal';
  b.opened = true;
  soundTap(); soundDrum();
  msg(t('opening'));
  b.el.classList.add('tremble', 'picked');
  await sleep(700); if (!alive(id)) return;
  b.el.classList.remove('tremble', 'picked');
  b.el.classList.add('open'); soundOpen();
  if (b.hazard) {
    burstParticles(b.el, false); soundLose();
    await sleep(1300); if (!alive(id)) return;
    showPartyLose(b.el.querySelector('.content img').src);
  } else {
    burstParticles(b.el, true);
    playTone(1047, 0.15, 'sine', 0.3); playTone(1319, 0.25, 'sine', 0.3, 0.1);
    msg(t('partySafe'));
    await sleep(1100); if (!alive(id)) return;
    b.el.classList.add('dim');
    G.turn = (G.turn + 1) % G.players;
    renderPlayers();
    msg(t('turn', (G.turn + 1) + 'P'));
    G.phase = 'choose';
  }
}

// ===== 結果画面 =====
function resetOverlay() {
  const ov = $('resultOverlay');
  ov.classList.remove('show', 'lose-bg', 'goal-bg');
  $('resultText').className = 'result-text';
  $('goalSub').innerHTML = '';
  $('celebration').style.display = 'none';
  $('celebration').style.opacity = '0';
  $('celebration').style.transform = 'translateY(120px)';
  $('congratsBalloon').style.display = 'none';
}
function finishRecord(cleared) {
  const r = getRec(G.mode);
  const isNew = cleared > r.best;
  r.best = Math.max(r.best, cleared);
  if (cleared >= TOTAL) r.goals++;
  store[G.mode] = r;
  saveStore();
  return isNew;
}
function recordHtml(cleared, isNew) {
  const r = getRec(G.mode);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  return (isNew ? `<span class="newrec">${esc(t('newRec'))}</span>` : '') +
    esc(t('cleared', cleared)) + '<br>' + esc(t('best', r.best));
}
function showLose(imgSrc) {
  G.phase = 'over';
  const isNew = finishRecord(G.round);
  resetOverlay();
  $('resultImg').src = imgSrc;
  $('resultText').textContent = t('gameOver');
  $('resultText').classList.add('lose');
  $('goalSub').innerHTML = recordHtml(G.round, isNew);
  $('resultOverlay').classList.add('lose-bg');
  setTimeout(() => $('resultOverlay').classList.add('show'), 50);
}
function showPartyLose(imgSrc) {
  G.phase = 'over';
  resetOverlay();
  $('resultImg').src = imgSrc;
  $('resultText').textContent = t('partyLose', (G.turn + 1) + 'P');
  $('resultText').classList.add('lose');
  $('resultOverlay').classList.add('lose-bg');
  setTimeout(() => $('resultOverlay').classList.add('show'), 50);
}
let autoReturnTimer = null;
function showGoal() {
  G.phase = 'over';
  const isNew = finishRecord(TOTAL);
  resetOverlay();
  $('resultImg').src = IMG_SUIT;
  $('resultText').textContent = t('goal');
  $('resultText').classList.add('goal');
  const r = getRec(G.mode);
  $('goalSub').innerHTML = (isNew ? `<span class="newrec">${t('newRec')}</span>` : '') + t('goalSub') +
    '<br>' + t('goalCount', r.goals, r.plays);
  $('resultOverlay').classList.add('goal-bg');
  $('charaMax').src = IMG_MAX;
  $('charaSmall').src = IMG_WIN;
  $('congratsBalloon').style.display = 'block';
  soundGoal();
  launchFireworks();
  startConfetti();
  setTimeout(() => $('resultOverlay').classList.add('show'), 50);
  setTimeout(() => {
    const cel = $('celebration');
    cel.style.display = 'flex';
    requestAnimationFrame(() => requestAnimationFrame(() => { cel.style.opacity = '1'; cel.style.transform = 'translateY(0)'; }));
  }, 150);
  // 自動でタイトルに戻らない（ボタンを押すまでお祝いを続ける）
}

// ===== 紙吹雪 =====
let confAnim = null;
function startConfetti() {
  stopConfetti();
  const canvas = $('confCanvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#ffd700', '#ff6fa8', '#4ecdc4', '#3ec96b', '#a78bfa', '#ff8c42', '#fff'];
  const N = Math.min(90, Math.round(canvas.width * canvas.height / 4000));
  const ps = Array.from({ length: N }, () => ({
    x: Math.random() * canvas.width, y: -Math.random() * canvas.height,
    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, vy: 1.2 + Math.random() * 2.2,
    sw: Math.random() * Math.PI * 2, sws: 0.02 + Math.random() * 0.04, rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.2,
    c: pick(colors)
  }));
  (function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of ps) {
      p.y += p.vy; p.sw += p.sws; p.rot += p.vr;
      const x = p.x + Math.sin(p.sw) * 30;
      if (p.y > canvas.height + 20) { p.y = -20; p.x = Math.random() * canvas.width; }
      ctx.save(); ctx.translate(x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.sw)), p.w, p.h * Math.abs(Math.cos(p.sw)) + 1);
      ctx.restore();
    }
    confAnim = requestAnimationFrame(draw);
  })();
}
function stopConfetti() {
  if (confAnim) { cancelAnimationFrame(confAnim); confAnim = null; }
  const c = $('confCanvas');
  c.getContext('2d').clearRect(0, 0, c.width, c.height);
}

// ===== 花火 =====
let fwAnim = null, fwParticles = [], fwTimers = [];
function launchFireworks() {
  const canvas = $('fwCanvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  fwParticles = [];
  function spawn() {
    const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
    const y = Math.random() * canvas.height * 0.4 + canvas.height * 0.1;
    const hue = Math.random() * 360;
    const count = 70 + rand(30);
    soundFirework();
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count, speed = Math.random() * 6 + 4;
      fwParticles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1,
        decay: 0.01 + Math.random() * 0.01, color: `hsl(${hue + Math.random() * 40},95%,62%)`, r: Math.random() * 3 + 2 });
    }
  }
  for (let i = 0; i < 12; i++) fwTimers.push(setTimeout(spawn, i * 600));
  (function animate() {
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (const p of fwParticles) {
      if (p.life <= 0) continue;
      p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.vx *= 0.98; p.vy *= 0.98; p.life -= p.decay;
      ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    fwParticles = fwParticles.filter(p => p.life > 0);
    fwAnim = requestAnimationFrame(animate);
  })();
}
function stopFireworks() {
  if (fwAnim) { cancelAnimationFrame(fwAnim); fwAnim = null; }
  fwTimers.forEach(clearTimeout); fwTimers = []; fwParticles = [];
  const c = $('fwCanvas');
  c.getContext('2d').clearRect(0, 0, c.width, c.height);
}

// ===== 画面遷移 =====
function goToStart() {
  G.gid++;
  clearTimeout(autoReturnTimer); autoReturnTimer = null;
  clearTimeout(G.hintTimer);
  G.phase = 'idle';
  G.busy = false;
  stopFireworks();
  stopConfetti();
  resetOverlay();
  $('banner').classList.remove('show');
  $('curtain').classList.remove('on');
  if (G.askResolve) G.askResolve(false);
  setScene('space');
  renderRules(); renderRecord();
  $('startScreen').classList.remove('hide');
}
function startGame() {
  ensureAudio();
  soundTap();
  G.gid++;
  clearTimeout(autoReturnTimer);
  stopFireworks();
  stopConfetti();
  resetOverlay();
  G.round = 0;
  G.items = { shield: 0, peek: 0, slow: 0 };
  G.slowNext = false;
  G.hints = HINTS_PER_GAME;
  G.superUsed = false;
  G.boxes = [];
  $('startScreen').classList.add('hide');
  const solo = G.mode !== 'party';
  $('map').style.display = solo ? '' : 'none';
  $('players').style.display = solo ? 'none' : '';
  if (solo) {
    const r = getRec(G.mode);
    r.plays++;
    store[G.mode] = r;
    saveStore();
    setScene(STAGES[0].scene);
    buildBoxes(STAGES[0].boxes, STAGES[0].boxes);
    renderMap(); renderStageLabel(); renderItems();
    msg('');
    const id = G.gid;
    setTimeout(() => { if (alive(id)) startRound(); }, 500);
  } else {
    startParty();
  }
}

// ===== イベント登録 =====
$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('titleBtn').addEventListener('click', goToStart);
$('homeBtn').addEventListener('click', () => {
  if (G.phase === 'idle') return;
  if (window.confirm(t('quitQ'))) goToStart();
});
function toggleSound() {
  soundOn = !soundOn;
  store.sound = soundOn; saveStore();
  renderToggles();
  if (soundOn) { ensureAudio(); soundTap(); }
}
$('soundToggle').addEventListener('click', toggleSound);
$('soundBtn').addEventListener('click', toggleSound);
$('kanaToggle').addEventListener('click', () => {
  kana = !kana;
  store.kana = kana; saveStore();
  applyTexts();
});
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    G.mode = btn.dataset.mode;
    $('playerSelect').classList.toggle('show', G.mode === 'party');
    renderRules(); renderRecord();
  });
});
document.querySelectorAll('.pl-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pl-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    G.players = Math.min(4, Math.max(2, parseInt(btn.dataset.pl, 10) || 2));
  });
});

// 初期化
applyTexts();
renderMap();
